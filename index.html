  hitPoints = [];
  labelBoxes = [];
  const target = catalogById[state.targetId] || null;
  const targetPosition = target ? objectPosition(target, date) : null;

  drawBackground();
  drawGrid();
  drawConstellationLines(target);
  drawStars();
  drawGround();              // after stars/lines: dims what is below the horizon
  drawHorizon();
  drawSolarSystem(target);
  drawStations(target, date);
  drawDeepSky(target);
  drawConstellationNames(target);
  drawStarNames(target);
  drawTargetMarker(targetPosition);
  drawCentreCross();
  drawGuideArrow(targetPosition);
  return { target, targetPosition };
}

/** Catalog id of the object closest to a tap, or null. */
function objectAtScreenPoint(x, y) {
  let best = null, bestDistance = TAP_RADIUS_PX;
  for (const point of hitPoints) {
    const distance = Math.hypot(point.x - x, point.y - y);
    if (distance < bestDistance) { best = point.id; bestDistance = distance; }
  }
  return best;
}

// ===== ui.js
// =============================================================================
// ui.js - Buttons, panels ("sheets"), lists, guidance text and touch input.
//
// Panels: target picker, "what's up", station passes, settings, help.
// The guidance text at the top ("Turn 35° right, up 12°") is refreshed a few
// times per second from the same view vectors the renderer uses.
//
// Depends on: core.js, i18n.js, astro.js, tle.js, sensors.js, render.js.
// =============================================================================

// ---------------------------------------------------------------- configuration
const ON_TARGET_DEGREES = 3.5;        // inside this the phone vibrates
const ALMOST_DEGREES = 7;
const GUIDE_REFRESH_MS = 200;         // text refresh rate (the sky redraws every frame)
const RISE_SET_REFRESH_MS = 60000;

const $ = (id) => document.getElementById(id);
let lastGuideUpdate = 0;
let riseSetCache = { id: null, at: 0, info: null };
let currentTab = "sat";

// ---------------------------------------------------------------- toast
let toastTimer = null;
/** Short message at the bottom of the screen. */
function toast(message) {
  const box = $("toast");
  box.textContent = message;
  box.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.classList.remove("show"), 4200);
}

// ---------------------------------------------------------------- sheets
/** Open one panel (closes the others). */
function openSheet(id) {
  document.querySelectorAll(".sheet").forEach((sheet) => sheet.classList.toggle("open", sheet.id === id));
  if (id === "sheetTarget") renderTargetList();
  if (id === "sheetWhatsUp") renderWhatsUp();
  if (id === "sheetPasses") renderPasses();
  if (id === "sheetSettings") renderSettings();
}
function closeSheets() {
  document.querySelectorAll(".sheet").forEach((sheet) => sheet.classList.remove("open"));
}

// ---------------------------------------------------------------- targets
/** Choose what the arrow points to. */
function setTarget(id) {
  state.targetId = id;
  settings.targetId = id;
  saveSettings();
  state.vibrated = false;
  riseSetCache = { id: null, at: 0, info: null };
  const object = catalogById[id];
  if (object && object.kind === "body" && object.body === "Sun") toast(t("sunWarning"));
  closeSheets();
  updateGuide(true);
}

/** One-line description of an object: type, brightness, where it is now. */
function objectSubtitle(object, position) {
  const parts = [];
  if (object.kind === "sat") parts.push(t("typeStation"));
  else if (object.kind === "body") parts.push(t(object.body === "Sun" ? "typeSun" : object.body === "Moon" ? "typeMoon" : "typePlanet"));
  else if (object.kind === "star") parts.push(t("typeStar") + (object.constellation ? " · " + constellationName(object.constellation) : ""));
  else if (object.kind === "const") parts.push(t("typeConst"));
  else if (object.kind === "deep") parts.push(t("type" + object.type) + " · " + visibilityLabel(object.mag));
  if (position && object.kind !== "const" && typeof position.mag === "number" && object.kind !== "sat") {
    parts.push("mag " + formatNumber(position.mag, 1));
  }
  return parts.join(" · ");
}

/** "↑ 34° SO" or "↓ −12°" for list items. */
function positionBadge(position) {
  if (!position) return "";
  const arrow = position.alt >= 0 ? "↑" : "↓";
  return arrow + " " + Math.round(position.alt) + "° " + directionName(position.az);
}

/** Fill the target picker with the objects of the current tab or search. */
function renderTargetList() {
  const list = $("targetList");
  const query = $("targetSearch").value.trim().toLowerCase();
  const onlyUp = $("onlyVisible").checked;
  document.querySelectorAll("#targetTabs button").forEach((button) =>
    button.classList.toggle("active", button.dataset.tab === currentTab && !query));
  const date = nowDate();
  const rows = [];
  for (const object of catalog) {
    if (query) {
      const haystack = (objectName(object) + " " + (object.names ? object.names.en + " " + object.names.es : "") +
        " " + (object.abbr || "") + " " + (object.messier || "")).toLowerCase();
      if (!haystack.includes(query)) continue;
    } else if (object.kind !== currentTab) {
      continue;
    }
    const position = objectPosition(object, date);
    if (onlyUp && position && position.alt < 0) continue;
    rows.push({ object, position });
  }
  // Objects above the horizon first, then by brightness / importance.
  rows.sort((a, b) => {
    const upA = a.position && a.position.alt >= 0 ? 0 : 1;
    const upB = b.position && b.position.alt >= 0 ? 0 : 1;
    if (upA !== upB) return upA - upB;
    return (a.object.kind === "const" ? 0 : (a.object.mag || 0) - (b.object.mag || 0)) ||
      objectName(a.object).localeCompare(objectName(b.object));
  });
  list.innerHTML = rows.slice(0, 200).map(({ object, position }) =>
    `<button class="item${object.id === state.targetId ? " selected" : ""}" data-id="${escapeHtml(object.id)}">
       <span class="item-name">${escapeHtml(objectName(object))}</span>
       <span class="item-badge ${position && position.alt >= 0 ? "up" : "down"}">${escapeHtml(positionBadge(position))}</span>
       <span class="item-sub">${escapeHtml(objectSubtitle(object, position))}</span>
     </button>`).join("") || `<p class="empty">—</p>`;
}

// ---------------------------------------------------------------- what's up
/** Interesting objects above the horizon right now, grouped. */
function renderWhatsUp() {
  updateSkyFrame(true);
  const date = nowDate();
  const sections = [];
  const item = (object, position, extra) =>
    `<button class="item" data-id="${escapeHtml(object.id)}">
       <span class="item-name">${escapeHtml(objectName(object))}</span>
       <span class="item-badge up">${escapeHtml(positionBadge(position))}</span>
       <span class="item-sub">${escapeHtml(extra || objectSubtitle(object, position))}</span>
     </button>`;

  // Moon and planets that are up (the Sun only with its warning).
  const solar = SOLAR_BODIES.filter((body) => body !== "Sun" && sky.bodies[body].alt > 2)
    .map((body) => ({ object: catalogById["body:" + body], position: sky.bodies[body] }))
    .sort((a, b) => a.position.mag - b.position.mag);
  if (solar.length) {
    sections.push(`<h3>${t("sectionSolar")}</h3>` + solar.map(({ object, position }) => {
      const extra = object.body === "Moon"
        ? t("phase") + " " + Math.round((position.phase || 0) * 100) + "%"
        : objectSubtitle(object, position) + " · " + visibilityLabel(position.mag);
      return item(object, position, extra);
    }).join(""));
  }

  // Stations: now visible, or next visible pass.
  const stationRows = STATIONS.map((key) => {
    const object = catalogById["sat:" + key];
    const position = stationPosition(key, date);
    const next = getPasses(key).find((pass) => pass.visible);
    let extra;
    if (position && isStationVisible(position, date)) extra = t("satVisibleNow");
    else if (next) extra = t("nextVisiblePass", { when: formatWhen(next.visStart) });
    else extra = t("noVisiblePass");
    return `<button class="item" data-id="${object.id}"><span class="item-name">${escapeHtml(objectName(object))}</span>
      <span class="item-badge ${position && position.alt >= 0 ? "up" : "down"}">${escapeHtml(positionBadge(position))}</span>
      <span class="item-sub">${escapeHtml(extra)}</span></button>`;
  });
  sections.push(`<h3>${t("sectionSats")}</h3>` + stationRows.join(""));

  // Brightest stars above 10°.
  const stars = catalog.filter((o) => o.kind === "star")
    .map((object) => ({ object, position: objectPosition(object) }))
    .filter((row) => row.position.alt > 10).slice(0, 12);
  if (stars.length && sky.sunAlt < 0) sections.push(`<h3>${t("sectionStars")}</h3>` + stars.map((r) => item(r.object, r.position)).join(""));

  // Main constellations high enough to recognise.
  const constellations = catalog.filter((o) => o.kind === "const" && o.rank === 1)
    .map((object) => ({ object, position: objectPosition(object) }))
    .filter((row) => row.position.alt > 20)
    .sort((a, b) => b.position.alt - a.position.alt);
  if (constellations.length && sky.sunAlt < 0) {
    sections.push(`<h3>${t("sectionConst")}</h3>` + constellations.map((r) => item(r.object, r.position)).join(""));
  }

  const condition = t(skyCondition());
  const warning = sky.sunAlt > -0.83 ? `<p class="note">${t("dayWarning")}</p>` : "";
  $("whatsUpBody").innerHTML = `<p class="note">${escapeHtml(condition)} · ${escapeHtml(formatWhen(date))}</p>` +
    warning + (sections.join("") || `<p class="empty">${t("whatsUpEmpty")}</p>`);
}

// ---------------------------------------------------------------- passes
/** List the next passes of both stations (visible ones by default). */
function renderPasses() {
  const body = $("passesBody");
  body.innerHTML = `<p class="note">${t("computing")}</p>`;
  // Let the "computing" text paint before the (short) calculation.
  setTimeout(() => {
    const showAll = settings.showAllPasses;
    let html = "";
    for (const key of STATIONS) {
      const passes = getPasses(key).filter((pass) => showAll || pass.visible).slice(0, 12);
      const age = tleAgeDays(key);
      const tle = getTle(key);
      html += `<h3>${escapeHtml(t(key))}</h3>`;
      html += `<p class="note">${escapeHtml(t("tleAge", { n: formatNumber(Math.max(0, age), 1),
        src: t(tle && tle.source === "downloaded" ? "tleDownloaded" : "tleEmbedded") }))}</p>`;
      if (age > 7) html += `<p class="note warn">${escapeHtml(t("tleOld"))}</p>`;
      if (!passes.length) html += `<p class="empty">${t("noVisiblePass")}</p>`;
      for (const pass of passes) {
        const v = pass.visible;
        const start = v ? pass.visStart : pass.start, end = v ? pass.visEnd : pass.end;
        const startAz = v ? pass.visStartAz : pass.startAz, endAz = v ? pass.visEndAz : pass.endAz;
        const maxAlt = v ? pass.visMaxAlt : pass.maxAlt;
        const minutes = Math.max(1, Math.round((end - start) / 60000));
        html += `<div class="pass ${v ? "visible" : ""}">
          <div class="pass-when">${escapeHtml(formatWhen(start))} · ${minutes} min · ${t("passMax")} ${Math.round(maxAlt)}°</div>
          <div class="pass-path">${t("passStart")}: ${escapeHtml(directionName(startAz))} → ${t("passEnd")}: ${escapeHtml(directionName(endAz))}
            ${v ? `<b>${t("passVisible")}</b>` : `<i>${t("passNotVisible")}</i>`}</div>
          <button class="small" data-pass="${key}|${start.getTime()}">${t("goToPass")}</button>
        </div>`;
      }
    }
    html += `<label class="check"><input type="checkbox" id="showAllPasses" ${showAll ? "checked" : ""}> ${t("showAllPasses")}</label>`;
    html += `<button id="btnTleUpdate" class="wide">${t("tleUpdate")}</button>`;
    body.innerHTML = html;
  }, 30);
}

/** Jump the clock to one minute before a pass and point at the station. */
function goToPass(key, startMs) {
  state.timeMode = "custom";
  state.timeOffsetMs = startMs - 60000 - Date.now();
  setTarget("sat:" + key);
  updateSkyFrame(true);
  refreshStatus();
}

// ---------------------------------------------------------------- settings
function renderSettings() {
  $("setLang").value = state.lang;
  $("setGps").checked = settings.useGps;
  $("setLat").value = formatCoordinate(state.observer.lat);
  $("setLon").value = formatCoordinate(state.observer.lon);
  $("setLat").disabled = $("setLon").disabled = settings.useGps && state.gpsStatus === "ok";
  $("setTimeMode").value = state.timeMode;
  $("setTime").value = toLocalInputValue(nowDate());
  $("setTime").disabled = state.timeMode !== "custom";
  $("setLines").checked = settings.showLines;
  $("setConstNames").checked = settings.showConstNames;
  $("setStarNames").checked = settings.showStarNames;
  $("setGrid").checked = settings.showGrid;
  $("setTrack").checked = settings.showTrack;
  $("setNight").checked = settings.nightMode;
  $("setNightStrength").value = settings.nightStrength;
  $("setFov").value = settings.fov;
  $("setCameraFov").value = settings.cameraFov;
  $("setCompass").value = settings.compassOffset;
  refreshSettingValues();
}

function formatCoordinate(value) { return (Math.round(value * 10000) / 10000).toString(); }

/** Date -> "2026-11-21T21:30" for <input type="datetime-local">. */
function toLocalInputValue(date) {
  const pad = (n) => String(n).padStart(2, "0");
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

/** Numbers shown next to the sliders. */
function refreshSettingValues() {
  $("valFov").textContent = settings.fov + "°";
  $("valCameraFov").textContent = settings.cameraFov + "°";
  $("valCompass").textContent = (settings.compassOffset > 0 ? "+" : "") + settings.compassOffset + "°";
  $("valNightStrength").textContent = settings.nightStrength + "%";
}

/** Read the location typed by hand (only used when the GPS is off or failed). */
function applyManualLocation() {
  const lat = parseFloat($("setLat").value.replace(",", "."));
  const lon = parseFloat($("setLon").value.replace(",", "."));
  if (!isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) return;
  state.observer.lat = settings.lat = lat;
  state.observer.lon = settings.lon = lon;
  saveSettings();
  onObserverChanged();
}

/** Called when the place changes: positions and passes must be recomputed. */
function onObserverChanged() {
  state.passes = { ISS: null, CSS: null };
  riseSetCache = { id: null, at: 0, info: null };
  updateSkyFrame(true);
  refreshStatus();
}

/**
 * Night mode: a red layer multiplied over everything. Its opacity is the
 * user's strength setting, so at lower values some colour and brightness
 * remain (the full-strength filter turned the whole screen deep red).
 */
function applyNightMode() {
  document.body.classList.toggle("night", settings.nightMode);
  $("nightFilter").style.opacity = String(settings.nightStrength / 100);
}

/** Change the interface language (from the intro buttons or the settings). */
function setLanguage(lang) {
  state.lang = settings.lang = lang;
  settings.langChosen = true;
  saveSettings();
  applyLanguage();
  refreshIntroLanguage();
  if ($("sheetSettings").classList.contains("open")) renderSettings();
  updateGuide(true);
  refreshStatus();
}

/** Highlight the chosen language on the start screen and refresh its warning. */
function refreshIntroLanguage() {
  document.querySelectorAll("#introLang button").forEach((button) =>
    button.classList.toggle("active", button.dataset.lang === state.lang));
  $("introWarning").textContent = window.isSecureContext ? "" : t("needsHttps");
}

// ---------------------------------------------------------------- calibration
/** Start compass calibration on the current target (should be the Moon or similar). */
function startCalibration() {
  const target = catalogById[state.targetId];
  const position = target ? objectPosition(target) : null;
  if (!position || position.alt < 3) { toast(t("calibrateNeedTarget")); return; }
  closeSheets();
  state.calibrating = true;
  $("calibrateBar").classList.add("show");
}

/** The user says the target is in the centre: the azimuth error is the offset. */
function finishCalibration() {
  const target = catalogById[state.targetId];
  const position = target ? objectPosition(target) : null;
  if (position && sensorsAlive()) {
    const pointing = vecToAzAlt(state.sensor.forward);
    // Positive error = the sensor points to the right of where the phone really points.
    const error = Math.round(wrap180(pointing.az - position.az));
    settings.compassOffset = Math.max(-90, Math.min(90, settings.compassOffset - error));
    saveSettings();
    toast(t("calibrated", { n: settings.compassOffset }));
  }
  cancelCalibration();
}
function cancelCalibration() {
  state.calibrating = false;
  $("calibrateBar").classList.remove("show");
}

// ---------------------------------------------------------------- guidance text
/** Rise/set information for the target, cached for a minute. */
function cachedRiseSet(object) {
  const now = Date.now();
  if (riseSetCache.id !== object.id || now - riseSetCache.at > RISE_SET_REFRESH_MS) {
    let info = null;
    try { info = riseSetInfo(object); } catch (error) { info = null; }
    riseSetCache = { id: object.id, at: now, info };
  }
  return riseSetCache.info;
}

/** Second line under the target name: where it is and when to look. */
function targetDetails(object, position, date) {
  if (!position) return "";
  const lines = [];
  const where = `${t("altitude")} ${Math.round(position.alt)}° · ${t("azimuth")} ${directionName(position.az)} (${Math.round(position.az)}°)`;
  lines.push(where);
  if (object.kind === "sat") {
    lines[0] += ` · ${formatNumber(position.range, 0)} ${t("kmUnit")}`;
    if (position.alt > 0 && isStationVisible(position, date)) lines.push(t("satVisibleNow"));
    else if (position.alt > 0 && !position.lit) lines.push(t("satNotLit"));
    else if (position.alt > 0 && sunAltitudeAt(date) > SUN_ALT_DARK_ENOUGH) lines.push(t("satDaylight"));
    const next = getPasses(object.key).find((pass) => pass.visible && pass.visEnd > date);
    lines.push(next ? t("nextVisiblePass", { when: formatWhen(next.visStart) + " (" + directionName(next.visStartAz) + " → " + directionName(next.visEndAz) + ")" }) : t("noVisiblePass"));
    return lines.join("\n");
  }
  if (object.kind === "body") {
    const info = sky.bodies[object.body];
    const distance = object.body === "Moon"
      ? formatNumber(info.dist * 149597870.7, 0) + " " + t("kmUnit")
      : formatNumber(info.dist, 2) + " " + t("auUnit");
    lines[0] += ` · mag ${formatNumber(info.mag, 1)}`;
    lines.push(t("distance") + " " + distance + (object.body === "Moon" ? " · " + t("phase") + " " + Math.round(info.phase * 100) + "%" : ""));
    if (object.body === "Sun") lines.push(t("sunWarning"));
  }
  const riseSet = cachedRiseSet(object);
  if (riseSet) {
    if (riseSet.never) lines.push(t("neverRises"));
    else if (riseSet.always) lines.push(t("circumpolar"));
    else if (position.alt < 0) {
      lines.push(t("belowNow", { alt: Math.round(position.alt) }));
      if (riseSet.rise) lines.push(t("risesAt", { time: formatWhen(riseSet.rise), dir: directionName(riseSet.riseAz) }));
    } else if (riseSet.set) {
      lines.push(t("setsAt", { time: formatWhen(riseSet.set), dir: directionName(riseSet.setAz) }));
    }
    if (riseSet.transit && riseSet.transitAlt > 0 && !riseSet.never) {
      lines.push(t("transitAt", { time: formatWhen(riseSet.transit), alt: Math.round(riseSet.transitAlt) }));
    }
  }
  return lines.join("\n");
}

/** Refresh the instruction ("turn right 30°, up 10°") and the target details. */
function updateGuide(force) {
  const now = performance.now();
  if (!force && now - lastGuideUpdate < GUIDE_REFRESH_MS) return;
  lastGuideUpdate = now;
  const date = nowDate();
  const object = catalogById[state.targetId];
  $("targetName").textContent = object ? objectName(object) : t("chooseTarget");
  if (!object) { $("guideText").textContent = ""; $("targetInfo").textContent = ""; return; }
  const position = objectPosition(object, date);
  if (!position) return;
  $("targetInfo").textContent = targetDetails(object, position, date);

  const separation = angleBetween(position.vec, view.forward);
  let instruction;
  if (separation < ON_TARGET_DEGREES) {
    instruction = t("onTarget");
    if (!state.vibrated && state.mode === "sensors") { buzz(); state.vibrated = true; }
  } else {
    if (separation > ALMOST_DEGREES * 1.5) state.vibrated = false;
    if (separation < ALMOST_DEGREES) {
      instruction = t("almost");
    } else {
      const pointing = vecToAzAlt(view.forward);
      const dAz = wrap180(position.az - pointing.az);
      const dAlt = position.alt - pointing.alt;
      const parts = [];
      // Near the zenith the azimuth is meaningless: only tilt then.
      if (Math.abs(dAz) >= 3 && Math.abs(pointing.alt) < 85) {
        parts.push(t(dAz > 0 ? "turnRight" : "turnLeft", { n: Math.round(Math.abs(dAz)) }));
      }
      if (Math.abs(dAlt) >= 3) parts.push(t(dAlt > 0 ? "tiltUp" : "tiltDown", { n: Math.round(Math.abs(dAlt)) }));
      instruction = parts.join(", ");
      instruction = instruction.charAt(0).toUpperCase() + instruction.slice(1);
    }
  }
  $("guideText").textContent = instruction;
  $("guide").classList.toggle("locked", separation < ON_TARGET_DEGREES);
}

// ---------------------------------------------------------------- status line
/** Small line with sensor / GPS / time status. */
function refreshStatus() {
  const parts = [];
  if (state.mode === "sensors") parts.push(t("statusSensors") + (sensorsAlive() ? " ✓" : " …"));
  else parts.push(t("statusManual"));
  if (state.gpsStatus === "ok") parts.push(t("gpsOk", { n: Math.round(state.gpsAccuracy || 0) }));
  else if (state.gpsStatus === "waiting" && settings.useGps) parts.push(t("gpsWaiting"));
  else parts.push(formatNumber(state.observer.lat, 2) + "°, " + formatNumber(state.observer.lon, 2) + "° (" + t("manualLocation") + ")");
  parts.push(formatTime(nowDate()));
  parts.push(t(skyCondition()));
  $("statusText").textContent = parts.join(" · ");
  $("timeBanner").classList.toggle("show", state.timeMode === "custom");
  $("timeBannerText").textContent = formatWhen(nowDate());
  // Mode button: icon + label (both are our own fixed texts, safe for innerHTML).
  const sensorsMode = state.mode === "sensors";
  $("btnMode").innerHTML = `<span class="icon">${sensorsMode ? "📱" : "✋"}</span><span>${t(sensorsMode ? "modeSensors" : "modeManual")}</span>`;
  $("btnMode").classList.toggle("active", state.mode === "sensors");
  $("btnCamera").classList.toggle("active", state.cameraOn);
}

// ---------------------------------------------------------------- modes
/** Switch to following the phone's sensors. */
async function enableSensors() {
  const ok = await startOrientation();
  if (!ok) { toast(t("noCompass")); state.mode = "manual"; refreshStatus(); return; }
  state.mode = "sensors";
  refreshStatus();
  // If no reading arrives, the browser has no usable compass.
  setTimeout(() => {
    if (state.mode === "sensors" && !sensorsAlive()) {
      toast(t("noCompass"));
      state.mode = "manual";
      refreshStatus();
    } else if (state.mode === "sensors") {
      toast(t("compassHint"));
    }
  }, 3000);
}

function enableManual() {
  // Keep looking where the phone was looking.
  if (sensorsAlive()) {
    const azAlt = vecToAzAlt(state.sensor.forward);
    state.manualAz = azAlt.az; state.manualAlt = Math.max(-30, Math.min(89, azAlt.alt));
  }
  state.mode = "manual";
  refreshStatus();
}

// ---------------------------------------------------------------- touch / mouse input
const pointers = new Map();
let dragStart = null;
let pinchStart = null;

/** Zoom by changing the field of view (only the drawn sky; the camera is fixed). */
function zoomBy(factor) {
  if (state.cameraOn) return;
  settings.fov = Math.round(Math.max(15, Math.min(110, settings.fov * factor)));
  saveSettings();
}

function onPointerDown(event) {
  canvas.setPointerCapture(event.pointerId);
  pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  if (pointers.size === 1) {
    dragStart = { x: event.clientX, y: event.clientY, az: state.manualAz, alt: state.manualAlt, moved: false };
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchStart = { distance: Math.hypot(a.x - b.x, a.y - b.y), fov: settings.fov };
    dragStart = null;
  }
}

function onPointerMove(event) {
  if (!pointers.has(event.pointerId)) return;
  pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  if (pointers.size === 2 && pinchStart) {
    const [a, b] = [...pointers.values()];
    const distance = Math.hypot(a.x - b.x, a.y - b.y);
    if (!state.cameraOn) settings.fov = Math.round(Math.max(15, Math.min(110, pinchStart.fov * pinchStart.distance / Math.max(20, distance))));
    return;
  }
  if (!dragStart) return;
  const dx = event.clientX - dragStart.x, dy = event.clientY - dragStart.y;
  if (Math.hypot(dx, dy) > 8) dragStart.moved = true;
  if (state.mode !== "manual" || !dragStart.moved) return;
  // Dragging moves the sky with the finger: degrees per pixel = fov / screen height.
  const degreesPerPixel = currentFov() / view.height;
  state.manualAz = ((dragStart.az - dx * degreesPerPixel / Math.max(0.2, Math.cos(state.manualAlt * DEG))) % 360 + 360) % 360;
  state.manualAlt = Math.max(-60, Math.min(89.5, dragStart.alt + dy * degreesPerPixel));
}

function onPointerUp(event) {
  const wasTap = dragStart && !dragStart.moved && pointers.size === 1;
  pointers.delete(event.pointerId);
  if (pointers.size < 2) { if (pinchStart) saveSettings(); pinchStart = null; }
  if (wasTap) {
    const id = objectAtScreenPoint(event.clientX, event.clientY);
    if (id) setTarget(id);
  }
  if (pointers.size === 0) dragStart = null;
}

// ---------------------------------------------------------------- wiring
/** Connect every button and input to its action. */
function wireUi() {
  canvas.addEventListener("pointerdown", onPointerDown);
  canvas.addEventListener("pointermove", onPointerMove);
  canvas.addEventListener("pointerup", onPointerUp);
  canvas.addEventListener("pointercancel", onPointerUp);
  canvas.addEventListener("wheel", (event) => { event.preventDefault(); zoomBy(event.deltaY > 0 ? 1.1 : 0.9); }, { passive: false });

  $("btnTarget").addEventListener("click", () => openSheet("sheetTarget"));
  $("btnWhatsUp").addEventListener("click", () => openSheet("sheetWhatsUp"));
  $("btnPasses").addEventListener("click", () => openSheet("sheetPasses"));
  $("btnSettings").addEventListener("click", () => openSheet("sheetSettings"));
  $("btnHelp").addEventListener("click", () => openSheet("sheetHelp"));
  $("btnMode").addEventListener("click", () => (state.mode === "sensors" ? enableManual() : enableSensors()));
  $("btnCamera").addEventListener("click", () => (state.cameraOn ? stopCamera() : startCamera()).then(refreshStatus));
  document.querySelectorAll(".sheet .close").forEach((button) => button.addEventListener("click", closeSheets));

  // Lists: one listener per container (items are rebuilt often).
  for (const id of ["targetList", "whatsUpBody"]) {
    $(id).addEventListener("click", (event) => {
      const item = event.target.closest("[data-id]");
      if (item) setTarget(item.dataset.id);
    });
  }
  $("passesBody").addEventListener("click", (event) => {
    const passButton = event.target.closest("[data-pass]");
    if (passButton) {
      const [key, startMs] = passButton.dataset.pass.split("|");
      goToPass(key, Number(startMs));
    }
    if (event.target.id === "btnTleUpdate") updateTlesNow();
  });
  $("passesBody").addEventListener("change", (event) => {
    if (event.target.id === "showAllPasses") {
      settings.showAllPasses = event.target.checked; saveSettings(); renderPasses();
    }
  });
  $("targetTabs").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-tab]");
    if (!button) return;
    currentTab = button.dataset.tab;
    $("targetSearch").value = "";
    renderTargetList();
  });
  $("targetSearch").addEventListener("input", renderTargetList);
  $("onlyVisible").addEventListener("change", renderTargetList);

  // Settings.
  $("setLang").addEventListener("change", (event) => setLanguage(event.target.value));
  $("introLang").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-lang]");
    if (button) setLanguage(button.dataset.lang);
  });
  $("setGps").addEventListener("change", (event) => {
    settings.useGps = event.target.checked; saveSettings();
    if (settings.useGps) startGps(); else { stopGps(); state.gpsStatus = "off"; }
    renderSettings(); refreshStatus();
  });
  $("setLat").addEventListener("change", applyManualLocation);
  $("setLon").addEventListener("change", applyManualLocation);
  $("setTimeMode").addEventListener("change", (event) => {
    state.timeMode = event.target.value;
    if (state.timeMode === "now") state.timeOffsetMs = 0;
    updateSkyFrame(true); renderSettings(); refreshStatus();
  });
  $("setTime").addEventListener("change", (event) => {
    const chosen = new Date(event.target.value);
    if (!isNaN(chosen)) { state.timeOffsetMs = chosen - Date.now(); updateSkyFrame(true); refreshStatus(); }
  });
  const toggles = { setLines: "showLines", setConstNames: "showConstNames", setStarNames: "showStarNames",
    setGrid: "showGrid", setTrack: "showTrack", setNight: "nightMode" };
  for (const [id, key] of Object.entries(toggles)) {
    $(id).addEventListener("change", (event) => { settings[key] = event.target.checked; saveSettings(); applyNightMode(); });
  }
  const sliders = { setFov: "fov", setCameraFov: "cameraFov", setCompass: "compassOffset", setNightStrength: "nightStrength" };
  for (const [id, key] of Object.entries(sliders)) {
    $(id).addEventListener("input", (event) => {
      settings[key] = Number(event.target.value); saveSettings(); refreshSettingValues(); applyNightMode();
    });
  }
  $("btnCalibrate").addEventListener("click", startCalibration);
  $("btnCalibrateDone").addEventListener("click", finishCalibration);
  $("btnCalibrateCancel").addEventListener("click", cancelCalibration);
  $("btnReset").addEventListener("click", () => {
    const keep = { lat: settings.lat, lon: settings.lon, lang: settings.lang, langChosen: settings.langChosen };
    Object.assign(settings, DEFAULT_SETTINGS, keep);
    saveSettings(); applyNightMode(); renderSettings();
  });
  $("btnBackToNow").addEventListener("click", () => {
    state.timeMode = "now"; state.timeOffsetMs = 0; updateSkyFrame(true); refreshStatus();
  });
}

/** Button "Update orbital data". */
async function updateTlesNow() {
  const updated = await refreshTles();
  if (updated) rebuildSatRecords();
  toast(t(updated ? "tleUpdated" : "tleFailed"));
  renderPasses();
}

// ===== main.js
// =============================================================================
// main.js - Start-up and the animation loop.
//
// Order at start: build the catalog -> prepare star vectors -> load TLEs ->
// wire the interface -> wait for "Start" (a tap is needed so the phone lets
// us use the sensors, vibration and the wake lock) -> draw every frame.
//
// Depends on: all the other src/*.js files (loaded before this one).
// =============================================================================

// ---------------------------------------------------------------- loop
/** One animation frame: draw the sky, refresh the texts now and then. */
function frame() {
  drawFrame();
  updateGuide(false);
  if (performance.now() - (frame.lastStatus || 0) > 1000) {
    frame.lastStatus = performance.now();
    refreshStatus();
  }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- start
/** The intro "Start" button: ask for sensors, GPS and keep the screen on. */
async function startApp(useSensors) {
  $("intro").classList.add("hidden");
  state.started = true;
  startGps();
  keepScreenOn();
  if (useSensors) await enableSensors();
  else enableManual();
  // Fresh orbital data when online (the built-in copy ages quickly).
  if (tlesNeedRefresh()) {
    refreshTles().then((updated) => { if (updated) { rebuildSatRecords(); toast(t("tleUpdated")); } });
  }
}

function init() {
  buildCatalog();
  prepareSkyVectors();
  rebuildSatRecords();
  resizeCanvas();
  applyLanguage();
  applyNightMode();
  wireUi();
  updateSkyFrame(true);
  $("btnStart").addEventListener("click", () => startApp(true));
  $("btnStartManual").addEventListener("click", () => startApp(false));
  refreshIntroLanguage();     // marks the active language and shows the https warning if needed
  // Phones without orientation sensors (a PC) start in manual mode directly.
  refreshStatus();
  requestAnimationFrame(frame);
}

init();

</script>

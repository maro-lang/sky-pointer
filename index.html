<!DOCTYPE html>
<!--
  Sky Pointer - template.html
  Page structure and styles. build.py replaces the three marker comments
  inside the script tags at the end (LIBS, DATA, APP) with the libraries, the
  sky data and the app code, producing one self-contained HTML file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Sky Pointer: point your phone at the sky to find the ISS, Tiangong, planets, stars and constellations.">
<!-- Security: no external code; network only to the two orbital-data sources. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src blob: mediastream:; connect-src https://celestrak.org https://tle.ivanstanojevic.me; base-uri 'none'; form-action 'none'">
<title>Sky Pointer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2304060d'/%3E%3Cpath d='M32 10l6 16 16 6-16 6-6 16-6-16-16-6 16-6z' fill='%23ffb84d'/%3E%3C/svg%3E">
<style>
/* ---------------------------------------------------------------- base */
:root {
  --bg: #04060d;
  --panel: rgba(12, 16, 30, 0.92);
  --panel-line: rgba(140, 170, 230, 0.18);
  --text: #e8ecf6;
  --muted: #9aa6c2;
  --accent: #ffb84d;
  --good: #7ee0a0;
  --radius: 14px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none;
  user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
#camera { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
body.camera-on #camera { display: block; }
#sky { position: fixed; inset: 0; display: block; }

/* Night mode: a red layer multiplied over everything, so the eyes stay adapted
   to the dark. A darker, less saturated red than pure #ff0000; its opacity
   (the strength slider in Settings) is set from ui.js. */
#nightFilter { position: fixed; inset: 0; pointer-events: none; display: none;
  background: #c4402f; mix-blend-mode: multiply; z-index: 50; opacity: 0.55; }
body.night #nightFilter { display: block; }

/* ---------------------------------------------------------------- top bar */
#topBar { position: fixed; left: 0; right: 0; top: 0; padding: calc(var(--safe-top) + 8px) 10px 8px;
  display: flex; flex-direction: column; gap: 6px; z-index: 10; pointer-events: none;
  background: linear-gradient(rgba(4, 6, 13, 0.85), rgba(4, 6, 13, 0)); }
#btnTarget { pointer-events: auto; text-align: left; padding: 9px 12px; border-radius: var(--radius);
  background: var(--panel); border: 1px solid var(--panel-line); display: block; width: 100%; }
#targetName { font-weight: 650; font-size: 17px; color: var(--accent); }
#targetName::after { content: " ▾"; color: var(--muted); font-size: 13px; }
#targetInfo { display: block; white-space: pre-line; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
#guide { align-self: center; padding: 7px 14px; border-radius: 999px; background: rgba(255, 184, 77, 0.16);
  border: 1px solid rgba(255, 184, 77, 0.45); font-weight: 600; text-align: center; max-width: 94%; }
#guide:empty, #guideText:empty { display: none; }
#guide.locked { background: rgba(126, 224, 160, 0.22); border-color: var(--good); color: var(--good); }

/* ---------------------------------------------------------------- bottom bar */
#bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  padding: 6px 8px calc(var(--safe-bottom) + 8px);
  background: linear-gradient(rgba(4, 6, 13, 0), rgba(4, 6, 13, 0.9)); }
#statusText { text-align: center; font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
#bar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
#bar button { padding: 9px 2px; border-radius: 12px; background: var(--panel); border: 1px solid var(--panel-line);
  font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
#bar button .icon { font-size: 18px; line-height: 1; }
#bar button.active { border-color: var(--accent); color: var(--accent); }

#timeBanner { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-bottom) + 96px);
  z-index: 11; display: none; gap: 8px; align-items: center; padding: 6px 8px 6px 14px; border-radius: 999px;
  background: rgba(80, 40, 120, 0.9); font-size: 13px; white-space: nowrap; }
#timeBanner.show { display: flex; }
#timeBanner button { background: rgba(255, 255, 255, 0.15); padding: 4px 10px; border-radius: 999px; }

#calibrateBar { position: fixed; left: 10px; right: 10px; bottom: calc(var(--safe-bottom) + 96px); z-index: 12;
  display: none; padding: 12px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--accent); }
#calibrateBar.show { display: block; }
#calibrateBar .row { display: flex; gap: 8px; margin-top: 10px; }
#calibrateBar .row button { flex: 1; }

/* ---------------------------------------------------------------- sheets */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 82vh; z-index: 20;
  display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--panel-line);
  border-radius: 18px 18px 0 0; transform: translateY(105%); transition: transform 0.22s ease;
  padding-bottom: var(--safe-bottom); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  touch-action: pan-y; user-select: text; }
.sheet.open { transform: translateY(0); }
.sheet header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 6px; }
.sheet h2 { margin: 0; font-size: 18px; }
.sheet h3 { margin: 16px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.sheet .body { overflow-y: auto; padding: 0 14px 16px; -webkit-overflow-scrolling: touch; }
.close { padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 14px 8px; scrollbar-width: none; }
.tabs button { white-space: nowrap; padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); font-size: 13px; }
.tabs button.active { background: var(--accent); color: #1b1200; font-weight: 600; }
.search { margin: 0 14px 6px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--panel-line);
  background: rgba(0, 0, 0, 0.3); color: var(--text); font: inherit; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; width: 100%; text-align: left;
  padding: 10px 4px; border-bottom: 1px solid var(--panel-line); }
.item.selected .item-name { color: var(--accent); }
.item-name { font-weight: 600; }
.item-badge { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.item-badge.up { color: var(--good); }
.item-badge.down { color: var(--muted); }
.item-sub { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); margin: 6px 0; }
.note.warn { color: #ffcf8a; }
.empty { color: var(--muted); text-align: center; padding: 14px; }
.pass { padding: 10px 0; border-bottom: 1px solid var(--panel-line); opacity: 0.6; }
.pass.visible { opacity: 1; }
.pass-when { font-weight: 600; }
.pass-path { font-size: 13px; color: var(--muted); margin: 2px 0 6px; }
.pass-path b { color: var(--good); font-weight: 600; margin-left: 6px; }
.pass-path i { margin-left: 6px; }
button.small { padding: 5px 12px; border-radius: 999px; background: rgba(255, 184, 77, 0.18); color: var(--accent); font-size: 13px; }
button.wide { display: block; width: 100%; margin-top: 12px; padding: 11px; border-radius: 12px;
  background: rgba(255, 184, 77, 0.18); color: var(--accent); font-weight: 600; }
label.check, .field { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.field { justify-content: space-between; }
.field input[type=range] { flex: 1; accent-color: var(--accent); }
.field input[type=text], .field input[type=datetime-local], .field select {
  width: 55%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--panel-line);
  background: rgba(0, 0, 0, 0.35); color: var(--text); font: inherit; color-scheme: dark; }
.field .value { width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
#helpBody p { margin: 0 0 10px; }

/* ---------------------------------------------------------------- intro */
#intro { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
  padding: 24px; background: radial-gradient(circle at 50% 30%, #17224a, #04060d 70%); }
#intro.hidden { display: none; }
#intro .card { max-width: 420px; text-align: center; }
#intro h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: 0.02em; }
#intro h1 span { color: var(--accent); }
#intro .subtitle { color: var(--muted); margin: 0 0 20px; }
#intro p { margin: 0 0 14px; }
#btnStart { display: block; width: 100%; padding: 15px; border-radius: 14px; background: var(--accent); color: #1b1200;
  font-weight: 700; font-size: 17px; margin: 22px 0 10px; }
#btnStartManual { color: var(--muted); text-decoration: underline; }
#introLang { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 18px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.07); border: 1px solid var(--panel-line); }
#introLang button { padding: 6px 16px; border-radius: 999px; font-size: 14px; color: var(--muted); }
#introLang button.active { background: var(--accent); color: #1b1200; font-weight: 600; }
#introWarning { color: #ffcf8a; font-size: 13px; }

/* ---------------------------------------------------------------- toast */
#toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%, 40px); z-index: 60; max-width: 86%;
  padding: 10px 16px; border-radius: 12px; background: rgba(20, 26, 46, 0.95); border: 1px solid var(--panel-line);
  text-align: center; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
#toast.show { opacity: 1; }
/* Landscape: target card on the left, instruction on the right, less height. */
@media (orientation: landscape) and (max-height: 520px) {
  #topBar { flex-direction: row; align-items: flex-start; }
  #btnTarget { width: 58%; }
  #targetInfo { font-size: 12px; }
  #guide { align-self: flex-start; margin-left: auto; }
  #bar button { flex-direction: row; justify-content: center; gap: 6px; padding: 7px 2px; }
}
</style>
</head>
<body>
<video id="camera" playsinline muted autoplay></video>
<canvas id="sky"></canvas>
<div id="nightFilter"></div>

<!-- ============================================================ top bar -->
<div id="topBar">
  <button id="btnTarget"><span id="targetName"></span><span id="targetInfo"></span></button>
  <div id="guide"><span id="guideText"></span></div>
</div>

<!-- ============================================================ bottom bar -->
<div id="bottom">
  <div id="statusText"></div>
  <nav id="bar">
    <button id="btnWhatsUp"><span class="icon">✦</span><span data-i18n="whatsUp"></span></button>
    <button id="btnPasses"><span class="icon">🛰</span><span data-i18n="passes"></span></button>
    <button id="btnMode"></button>
    <button id="btnCamera"><span class="icon">◉</span><span data-i18n="camera"></span></button>
    <button id="btnSettings"><span class="icon">⚙</span><span data-i18n="settings"></span></button>
    <button id="btnHelp"><span class="icon">?</span><span data-i18n="help"></span></button>
  </nav>
</div>

<div id="timeBanner"><span>⏱ <span id="timeBannerText"></span></span><button id="btnBackToNow" data-i18n="timeNow"></button></div>

<div id="calibrateBar">
  <div data-i18n="calibrateHelp"></div>
  <div class="row">
    <button id="btnCalibrateDone" class="wide" data-i18n="calibrateDone"></button>
    <button id="btnCalibrateCancel" class="wide" data-i18n="calibrateCancel"></button>
  </div>
</div>

<!-- ============================================================ sheets -->
<section class="sheet" id="sheetTarget">
  <header><h2 data-i18n="chooseTarget"></h2><button class="close" data-i18n="close"></button></header>
  <div class="tabs" id="targetTabs">
    <button data-tab="sat" data-i18n="tabStations"></button>
    <button data-tab="body" data-i18n="tabSolar"></button>
    <button data-tab="star" data-i18n="tabStars"></button>
    <button data-tab="const" data-i18n="tabConst"></button>
    <button data-tab="deep" data-i18n="tabDeep"></button>
  </div>
  <input class="search" id="targetSearch" type="search" data-i18n-ph="search" autocomplete="off">
  <label class="check" style="padding:0 14px 4px"><input type="checkbox" id="onlyVisible"> <span data-i18n="onlyVisible"></span></label>
  <div class="body" id="targetList"></div>
</section>

<section class="sheet" id="sheetWhatsUp">
  <header><h2 data-i18n="whatsUpTitle"></h2><button class="close" data-i18n="close"></button></header>
  <div class="body" id="whatsUpBody"></div>
</section>

<section class="sheet" id="sheetPasses">
  <header><h2 data-i18n="passesTitle"></h2><button class="close" data-i18n="close"></button></header>
  <div class="body" id="passesBody"></div>
</section>

<section class="sheet" id="sheetSettings">
  <header><h2 data-i18n="settingsTitle"></h2><button class="close" data-i18n="close"></button></header>
  <div class="body">
    <div class="field"><span data-i18n="language"></span>
      <select id="setLang"><option value="es">Español</option><option value="en">English</option></select></div>

    <h3 data-i18n="location"></h3>
    <label class="check"><input type="checkbox" id="setGps"> <span data-i18n="useGps"></span></label>
    <div class="field"><span data-i18n="latitude"></span><input type="text" id="setLat" inputmode="decimal"></div>
    <div class="field"><span data-i18n="longitude"></span><input type="text" id="setLon" inputmode="decimal"></div>

    <h3 data-i18n="time"></h3>
    <div class="field"><select id="setTimeMode" style="width:100%">
      <option value="now" data-i18n="timeNow"></option><option value="custom" data-i18n="timeCustom"></option></select></div>
    <div class="field"><span></span><input type="datetime-local" id="setTime"></div>

    <h3 data-i18n="view"></h3>
    <label class="check"><input type="checkbox" id="setLines"> <span data-i18n="showLines"></span></label>
    <label class="check"><input type="checkbox" id="setConstNames"> <span data-i18n="showConstNames"></span></label>
    <label class="check"><input type="checkbox" id="setStarNames"> <span data-i18n="showStarNames"></span></label>
    <label class="check"><input type="checkbox" id="setTrack"> <span data-i18n="showTrack"></span></label>
    <label class="check"><input type="checkbox" id="setGrid"> <span data-i18n="showGrid"></span></label>
    <label class="check"><input type="checkbox" id="setNight"> <span data-i18n="nightMode"></span></label>
    <div class="field"><span data-i18n="nightStrength"></span><input type="range" id="setNightStrength" min="30" max="100" step="5"><span class="value" id="valNightStrength"></span></div>
    <div class="field"><span data-i18n="fieldOfView"></span><input type="range" id="setFov" min="15" max="110" step="1"><span class="value" id="valFov"></span></div>
    <div class="field"><span>📷 <span data-i18n="fieldOfView"></span></span><input type="range" id="setCameraFov" min="30" max="90" step="1"><span class="value" id="valCameraFov"></span></div>

    <h3 data-i18n="compass"></h3>
    <div class="field"><span data-i18n="compassOffset"></span><input type="range" id="setCompass" min="-90" max="90" step="1"><span class="value" id="valCompass"></span></div>
    <button id="btnCalibrate" class="wide" data-i18n="calibrate"></button>
    <p class="note" data-i18n="compassHint"></p>
    <button id="btnReset" class="wide" data-i18n="reset"></button>
    <p class="note">Sky Pointer v1.1 · 21-nov-2026</p>
  </div>
</section>

<section class="sheet" id="sheetHelp">
  <header><h2 data-i18n="helpTitle"></h2><button class="close" data-i18n="close"></button></header>
  <div class="body" id="helpBody" data-i18n-html="helpBody"></div>
</section>

<!-- ============================================================ intro -->
<div id="intro">
  <div class="card">
    <div id="introLang"><button data-lang="en">English</button><button data-lang="es">Español</button></div>
    <h1>Sky <span>Pointer</span></h1>
    <p class="subtitle" data-i18n="appSubtitle"></p>
    <p data-i18n="introText"></p>
    <p class="note" data-i18n="introNeeds"></p>
    <button id="btnStart" data-i18n="introStart"></button>
    <button id="btnStartManual" data-i18n="introNoSensors"></button>
    <p id="introWarning"></p>
  </div>
</div>

<div id="toast"></div>

<script>

// ---------------------------------------------------------------- lookup
/** Return the text for `key` in the current language, filling {params}. */
function t(key, params) {
  const table = TEXTS[state.lang] || TEXTS.es;
  let text = table[key] !== undefined ? table[key] : (TEXTS.es[key] !== undefined ? TEXTS.es[key] : key);
  if (params && typeof text === "string") {
    for (const name of Object.keys(params)) {
      text = text.split("{" + name + "}").join(String(params[name]));
    }
  }
  return text;
}

/** Replace the text of every element marked with data-i18n / data-i18n-ph. */
function applyLanguage() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach((element) => {
    element.textContent = t(element.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-html]").forEach((element) => {
    element.innerHTML = t(element.dataset.i18nHtml); // only our own static texts
  });
  document.querySelectorAll("[data-i18n-ph]").forEach((element) => {
    element.placeholder = t(element.dataset.i18nPh);
  });
}

// ===== core.js
// =============================================================================
// core.js - Shared state, saved settings and small math helpers.
//
// Everything in the app is in one global scope (the build concatenates the
// files), so this file defines the objects the other files use:
//   state     - what the app is doing right now (target, view, sensors...)
//   settings  - user choices that are saved in localStorage
//   vec*      - 3-D vector helpers
//
// Coordinate frame used everywhere: ENU (East, North, Up), unit vectors.
//   x = East, y = North, z = Up (zenith).
//   Azimuth is measured from North towards East (0 = N, 90 = E).
//
// Depends on: nothing. Loaded right after i18n.js.
// =============================================================================

// ---------------------------------------------------------------- configuration
const DEG = Math.PI / 180;
const RAD = 180 / Math.PI;
const STORAGE_KEY = "skyPointer.settings.v1";
const TLE_STORAGE_KEY = "skyPointer.tle.v1";

// Bratislava (city centre) is the starting location until the GPS answers.
const DEFAULT_LOCATION = { lat: 48.14, lon: 17.11, height: 140 };

const DEFAULT_SETTINGS = {
  lang: "en",             // English until the user picks a language
  langChosen: false,      // true once the user picked a language themselves
  useGps: true,
  lat: DEFAULT_LOCATION.lat,
  lon: DEFAULT_LOCATION.lon,
  height: DEFAULT_LOCATION.height,
  showLines: true,
  showConstNames: true,
  showStarNames: true,
  showGrid: false,
  showTrack: true,
  nightMode: false,
  nightStrength: 55,      // night-mode red filter strength, percent (30..100)
  fov: 70,                // vertical field of view of the sky view (degrees)
  cameraFov: 62,          // vertical field of view of a typical phone camera
  compassOffset: 0,       // degrees added to the sensor azimuth
  targetId: "sat:ISS",
  showAllPasses: false,
};

// ---------------------------------------------------------------- settings
/** Load saved settings; browser storage can be missing or blocked. */
function loadSettings() {
  let saved = {};
  try {
    saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {};
  } catch (error) {
    saved = {};
  }
  const merged = Object.assign({}, DEFAULT_SETTINGS, saved);
  // Version 1.0 saved "es" automatically without asking: only keep a language
  // the user chose on purpose, otherwise start in English.
  if (!merged.langChosen) merged.lang = DEFAULT_SETTINGS.lang;
  return merged;
}

/** Save settings, ignoring storage errors (private mode, sandboxes...). */
function saveSettings() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
  } catch (error) {
    /* storage not available: settings live only for this visit */
  }
}

const settings = loadSettings();

// ---------------------------------------------------------------- live state
const state = {
  lang: settings.lang,
  // Where the observer is (copied from settings, updated by the GPS).
  observer: { lat: settings.lat, lon: settings.lon, height: settings.height },
  gpsStatus: "waiting",       // waiting | ok | denied | off
  gpsAccuracy: null,
  // Time: live, or a fixed moment chosen by the user that keeps ticking.
  timeMode: "now",            // now | custom
  timeOffsetMs: 0,            // custom time = real time + offset
  // View: "sensors" follows the phone, "manual" is dragged by hand.
  mode: "manual",
  manualAz: 180,              // degrees, where the manual view looks
  manualAlt: 35,
  // Smoothed orientation from the sensors, as ENU vectors.
  sensor: {
    available: false,         // got at least one absolute reading
    absolute: false,          // reading is referenced to true/magnetic North
    forward: [0, 1, 0],       // where the back camera points
    up: [0, 0, 1],            // where the top of the screen points
    right: [1, 0, 0],
    lastEventMs: 0,
  },
  cameraOn: false,
  targetId: settings.targetId,
  onTargetSince: 0,           // time the target entered the centre (for vibration)
  vibrated: false,
  calibrating: false,
  passes: { ISS: null, CSS: null }, // computed pass lists
};

/** Current simulated time as a JavaScript Date. */
function nowDate() {
  return new Date(Date.now() + (state.timeMode === "custom" ? state.timeOffsetMs : 0));
}

// ---------------------------------------------------------------- vectors
function vecDot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function vecCross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function vecLength(a) { return Math.sqrt(vecDot(a, a)); }
function vecNorm(a) {
  const length = vecLength(a) || 1;
  return [a[0] / length, a[1] / length, a[2] / length];
}
function vecScale(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
function vecAdd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }

/** Azimuth/altitude (degrees) -> ENU unit vector. */
function azAltToVec(azDeg, altDeg) {
  const az = azDeg * DEG;
  const alt = altDeg * DEG;
  return [Math.cos(alt) * Math.sin(az), Math.cos(alt) * Math.cos(az), Math.sin(alt)];
}

/** ENU unit vector -> {az, alt} in degrees (az in 0..360). */
function vecToAzAlt(v) {
  const alt = Math.asin(Math.max(-1, Math.min(1, v[2]))) * RAD;
  let az = Math.atan2(v[0], v[1]) * RAD;
  if (az < 0) az += 360;
  return { az, alt };
}

/** Angle between two unit vectors, in degrees. */
function angleBetween(a, b) {
  return Math.acos(Math.max(-1, Math.min(1, vecDot(a, b)))) * RAD;
}

/** Wrap an angle difference into -180..180. */
function wrap180(angle) {
  let a = ((angle + 180) % 360 + 360) % 360 - 180;
  if (a === -180) a = 180;
  return a;
}

/** RA/Dec (degrees, J2000 equatorial) -> unit vector in the J2000 frame. */
function raDecToEqVec(raDeg, decDeg) {
  const ra = raDeg * DEG;
  const dec = decDeg * DEG;
  return [Math.cos(dec) * Math.cos(ra), Math.cos(dec) * Math.sin(ra), Math.sin(dec)];
}

// ---------------------------------------------------------------- formatting
/** Compass point name (N, NNE, ...) for an azimuth in degrees. */
function directionName(azDeg) {
  const names = t("dirs");
  return names[Math.round(((azDeg % 360) + 360) % 360 / 22.5) % 16];
}

/** "21:34" in the phone's local time zone. */
function formatTime(date) {
  return date.toLocaleTimeString(state.lang === "es" ? "es-ES" : "en-GB",
    { hour: "2-digit", minute: "2-digit" });
}

/** "hoy 21:34", "mañana 05:10" or "lun 23 nov 21:34". */
function formatWhen(date) {
  const now = nowDate();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dayIndex = Math.floor((date - startOfToday) / 86400000);
  if (dayIndex === 0) return t("today") + " " + formatTime(date);
  if (dayIndex === 1) return t("tomorrow") + " " + formatTime(date);
  return date.toLocaleDateString(state.lang === "es" ? "es-ES" : "en-GB",
    { weekday: "short", day: "numeric", month: "short" }) + " " + formatTime(date);
}

/** Format a number with the local decimal separator. */
function formatNumber(value, decimals) {
  return value.toLocaleString(state.lang === "es" ? "es-ES" : "en-GB",
    { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

/** Escape text before putting it into innerHTML (names come from data files). */
function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ===== tle.js
// =============================================================================
// tle.js - Orbital data (two-line elements, "TLE") for the ISS and Tiangong.
//
// The app carries a copy of the TLEs from the day it was built, so it works
// offline. When online it downloads fresh ones (they go stale in days: the
// stations are slowed by the atmosphere and fire their engines now and then).
// Downloaded TLEs are validated (format + checksum) and saved in localStorage.
//
// Sources tried in order (both are free and allow browser requests):
//   1. CelesTrak   https://celestrak.org/NORAD/elements/gp.php
//   2. TLE API     https://tle.ivanstanojevic.me/api/tle/<id>
//
// Depends on: core.js (TLE_STORAGE_KEY). Used by astro.js and ui.js.
// =============================================================================

// ---------------------------------------------------------------- configuration
// NORAD catalog numbers: 25544 = ISS (Zarya), 48274 = Tiangong core module Tianhe.
const STATION_NORAD_IDS = { ISS: 25544, CSS: 48274 };

// Built-in copy (epoch 19-Nov-2026), from tle.ivanstanojevic.me / CelesTrak.
const EMBEDDED_TLES = {
  ISS: {
    line1: "1 25544U 98067A   26323.26944509  .00013909  00000+0  25567-3 0  9994",
    line2: "2 25544  51.6317 252.6441 0007410  42.3196 317.8363 15.49482233595793",
    source: "embedded",
  },
  CSS: {
    line1: "1 48274U 21035A   26323.55661522  .00021030  00000+0  24862-3 0  9994",
    line2: "2 48274  41.4685  97.7847 0004903 262.8853  97.1429 15.60775386317435",
    source: "embedded",
  },
};

const TLE_DOWNLOAD_TIMEOUT_MS = 8000;
const TLE_AUTO_REFRESH_DAYS = 1;    // try to refresh when the saved copy is older

// ---------------------------------------------------------------- validation
/** TLE checksum: sum of digits (a minus sign counts 1) modulo 10. */
function tleChecksumOk(line) {
  if (line.length !== 69) return false;
  let sum = 0;
  for (let i = 0; i < 68; i++) {
    const c = line[i];
    if (c >= "0" && c <= "9") sum += c.charCodeAt(0) - 48;
    else if (c === "-") sum += 1;
  }
  return sum % 10 === Number(line[68]);
}

/** Check that two lines are a valid TLE for the expected satellite number. */
function isValidTle(line1, line2, noradId) {
  if (typeof line1 !== "string" || typeof line2 !== "string") return false;
  line1 = line1.trim(); line2 = line2.trim();
  const id = String(noradId).padStart(5, "0");
  return line1.startsWith("1 " + id) && line2.startsWith("2 " + id) &&
    tleChecksumOk(line1) && tleChecksumOk(line2);
}

/** Epoch of a TLE (line 1, columns 19-32: YYDDD.DDDDDDDD) as a Date. */
function tleEpoch(line1) {
  const year2 = Number(line1.substring(18, 20));
  const dayOfYear = Number(line1.substring(20, 32));
  const year = year2 < 57 ? 2000 + year2 : 1900 + year2;
  return new Date(Date.UTC(year, 0, 1) + (dayOfYear - 1) * 86400000);
}

// ---------------------------------------------------------------- storage
/** Saved TLEs merged over the embedded ones (newest epoch wins). */
function loadStoredTles() {
  const result = JSON.parse(JSON.stringify(EMBEDDED_TLES));
  try {
    const saved = JSON.parse(localStorage.getItem(TLE_STORAGE_KEY) || "{}") || {};
    for (const key of Object.keys(STATION_NORAD_IDS)) {
      const tle = saved[key];
      if (tle && isValidTle(tle.line1, tle.line2, STATION_NORAD_IDS[key]) &&
          tleEpoch(tle.line1) > tleEpoch(result[key].line1)) {
        result[key] = { line1: tle.line1, line2: tle.line2, source: "downloaded" };
      }
    }
  } catch (error) {
    /* storage blocked or corrupted: keep the embedded copy */
  }
  return result;
}

let currentTles = loadStoredTles();

function getTle(key) { return currentTles[key] || null; }

/** Age of the station's TLE in days (fractional). */
function tleAgeDays(key) {
  const tle = getTle(key);
  return tle ? (Date.now() - tleEpoch(tle.line1).getTime()) / 86400000 : Infinity;
}

function saveTles() {
  try {
    localStorage.setItem(TLE_STORAGE_KEY, JSON.stringify(currentTles));
  } catch (error) { /* ignore */ }
}

// ---------------------------------------------------------------- download
/** fetch() that gives up after TLE_DOWNLOAD_TIMEOUT_MS. */
async function fetchWithTimeout(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), TLE_DOWNLOAD_TIMEOUT_MS);
  try {
    return await fetch(url, { signal: controller.signal, cache: "no-store", credentials: "omit" });
  } finally {
    clearTimeout(timer);
  }
}

/** Try CelesTrak (plain text, 3 lines). Returns {line1, line2} or null. */
async function downloadFromCelestrak(noradId) {
  const response = await fetchWithTimeout(
    "https://celestrak.org/NORAD/elements/gp.php?CATNR=" + noradId + "&FORMAT=TLE");
  if (!response.ok) return null;
  const lines = (await response.text()).split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  const line1 = lines.find((l) => l.startsWith("1 "));
  const line2 = lines.find((l) => l.startsWith("2 "));
  return isValidTle(line1, line2, noradId) ? { line1, line2 } : null;
}

/** Try the TLE API (JSON with line1/line2). Returns {line1, line2} or null. */
async function downloadFromTleApi(noradId) {
  const response = await fetchWithTimeout("https://tle.ivanstanojevic.me/api/tle/" + noradId);
  if (!response.ok) return null;
  const data = await response.json();
  return data && isValidTle(data.line1, data.line2, noradId)
    ? { line1: data.line1.trim(), line2: data.line2.trim() } : null;
}

/**
 * Download fresh TLEs for both stations. Returns true if at least one was
 * updated. Never throws: network errors just keep the saved copy.
 */
async function refreshTles() {
  let updated = false;
  for (const key of Object.keys(STATION_NORAD_IDS)) {
    const id = STATION_NORAD_IDS[key];
    let fresh = null;
    for (const source of [downloadFromCelestrak, downloadFromTleApi]) {
      try {
        fresh = await source(id);
      } catch (error) {
        fresh = null; // offline, blocked by the browser, timeout...
      }
      if (fresh) break;
    }
    if (fresh && tleEpoch(fresh.line1) >= tleEpoch(currentTles[key].line1)) {
      currentTles[key] = { line1: fresh.line1, line2: fresh.line2, source: "downloaded" };
      updated = true;
    }
  }
  if (updated) saveTles();
  return updated;
}

/** Whether an automatic refresh is worth trying (saved copy older than a day). */
function tlesNeedRefresh() {
  return Object.keys(STATION_NORAD_IDS).some((key) => tleAgeDays(key) > TLE_AUTO_REFRESH_DAYS);
}

// ===== astro.js
// =============================================================================
// astro.js - Where everything is in the sky, for the observer and time.
//
// Builds the catalog of selectable objects and computes their positions as
// ENU unit vectors (East, North, Up):
//   - stars, constellations, deep-sky objects: fixed J2000 RA/Dec, turned
//     into the local sky with one rotation matrix (refreshed every second).
//   - Sun, Moon and planets: Astronomy Engine (topocentric, with refraction).
//   - ISS and Tiangong: satellite.js (SGP4) from two-line elements (TLE).
// Also predicts station passes and rise/set times.
//
// Depends on: core.js (state, vectors), i18n.js (t), sky_data.js (catalogs),
// tle.js (getTle), libraries Astronomy (global) and satellite (global).
// =============================================================================

// ---------------------------------------------------------------- configuration
const SOLAR_BODIES = ["Sun", "Moon", "Mercury", "Venus", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune"];
const STATIONS = ["ISS", "CSS"];             // keys used in tle.js
const PASS_SEARCH_HOURS = 72;                // how far ahead passes are searched
const PASS_STEP_SECONDS = 20;                // coarse step of the pass search
const PASS_MIN_VISIBLE_ELEVATION = 10;       // degrees; lower is lost in haze
const SUN_ALT_DARK_ENOUGH = -6;              // civil twilight end: stations show up
const SKY_FRAME_REFRESH_MS = 1000;           // how often fixed objects are re-rotated

// ---------------------------------------------------------------- catalog
// Every selectable object: { id, kind, names:{es,en}, mag, ...kind data }.
const catalog = [];
const catalogById = {};

/** Fill `catalog` once at start-up from the data files. */
function buildCatalog() {
  const add = (object) => { catalog.push(object); catalogById[object.id] = object; };

  for (const key of STATIONS) {
    add({ id: "sat:" + key, kind: "sat", key, names: null, mag: -2 });
  }
  for (const body of SOLAR_BODIES) {
    add({ id: "body:" + body, kind: "body", body, names: null, mag: 0 });
  }
  for (const row of SKY_NAMED_STARS) {
    const [starIndex, nameEs, nameEn, designation, constellation, isTarget] = row;
    if (!isTarget) continue;
    add({
      id: "star:" + starIndex, kind: "star", starIndex,
      names: { es: nameEs, en: nameEn }, designation, constellation,
      mag: SKY_STARS[starIndex * 4 + 2],
      ra: SKY_STARS[starIndex * 4], dec: SKY_STARS[starIndex * 4 + 1],
    });
  }
  for (const row of SKY_CONSTELLATIONS) {
    const [abbr, nameEs, nameEn, ra, dec, rank] = row;
    add({ id: "const:" + abbr, kind: "const", abbr, names: { es: nameEs, en: nameEn }, ra, dec, rank, mag: rank });
  }
  for (const row of SKY_DEEP_SKY) {
    const [messier, nameEs, nameEn, ra, dec, mag, type] = row;
    add({ id: "deep:" + messier, kind: "deep", messier, names: { es: nameEs, en: nameEn }, ra, dec, mag, type });
  }
  // Fixed objects keep their J2000 direction vector for fast rotation.
  for (const object of catalog) {
    if (object.ra !== undefined) object.eq = raDecToEqVec(object.ra, object.dec);
  }
}

/** Display name of a catalog object in the current language. */
function objectName(object, short) {
  if (!object) return t("noTarget");
  if (object.kind === "sat") return t(short ? object.key + "short" : object.key);
  if (object.kind === "body") return t(object.body);
  return object.names[state.lang] || object.names.es;
}

/** Name of a constellation from its abbreviation (e.g. "Ori" -> "Orión"). */
function constellationName(abbr) {
  const object = catalogById["const:" + abbr];
  return object ? objectName(object) : abbr;
}

// ---------------------------------------------------------------- sky frame
// sky.frame converts J2000 equatorial vectors into ENU for "now".
const sky = {
  frame: null,                       // 3x3 matrix, rows = E, N, U
  frameTimeMs: 0,
  starEq: null,                      // Float32Array, J2000 vectors of all stars
  starEnu: null,                     // Float32Array, same stars in ENU
  lineEq: {},                        // abbr -> [Float32Array per polyline]
  bodies: {},                        // body -> {vec, az, alt, dist, mag, phase}
  sunAlt: -90,
};

/** Pre-compute the J2000 vectors of every star and constellation line. */
function prepareSkyVectors() {
  const count = SKY_STARS.length / 4;
  sky.starEq = new Float32Array(count * 3);
  sky.starEnu = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const v = raDecToEqVec(SKY_STARS[i * 4], SKY_STARS[i * 4 + 1]);
    sky.starEq.set(v, i * 3);
  }
  for (const abbr of Object.keys(SKY_LINES)) {
    sky.lineEq[abbr] = SKY_LINES[abbr].map((polyline) => {
      const vectors = new Float32Array(polyline.length / 2 * 3);
      for (let p = 0; p < polyline.length / 2; p++) {
        vectors.set(raDecToEqVec(polyline[p * 2], polyline[p * 2 + 1]), p * 3);
      }
      return vectors;
    });
  }
}

/** Astronomy Engine observer object for the current location. */
function astroObserver() {
  return new Astronomy.Observer(state.observer.lat, state.observer.lon, state.observer.height);
}

/**
 * Rebuild the J2000 -> ENU rotation (includes precession and nutation) and
 * recompute every fixed object and solar-system body. Cheap enough to run
 * once per second; the sky turns only 0.004° per second.
 */
function updateSkyFrame(force) {
  const date = nowDate();
  if (!force && Math.abs(date - sky.frameTimeMs) < SKY_FRAME_REFRESH_MS) return;
  sky.frameTimeMs = date.getTime();

  const time = Astronomy.MakeTime(date);
  const observer = astroObserver();
  const rotation = Astronomy.Rotation_EQJ_HOR(time, observer);
  // Astronomy's horizontal frame is x = North, y = West, z = Zenith.
  // Rotating the three J2000 axes gives the columns of our matrix.
  const columns = [[1, 0, 0], [0, 1, 0], [0, 0, 1]].map((axis) => {
    const h = Astronomy.RotateVector(rotation, new Astronomy.Vector(axis[0], axis[1], axis[2], time));
    return [-h.y, h.x, h.z]; // -> East, North, Up
  });
  sky.frame = [
    [columns[0][0], columns[1][0], columns[2][0]],
    [columns[0][1], columns[1][1], columns[2][1]],
    [columns[0][2], columns[1][2], columns[2][2]],
  ];

  // Stars: one matrix product each.
  const m = sky.frame;
  const eq = sky.starEq;
  const out = sky.starEnu;
  for (let i = 0; i < eq.length; i += 3) {
    const x = eq[i], y = eq[i + 1], z = eq[i + 2];
    out[i] = m[0][0] * x + m[0][1] * y + m[0][2] * z;
    out[i + 1] = m[1][0] * x + m[1][1] * y + m[1][2] * z;
    out[i + 2] = m[2][0] * x + m[2][1] * y + m[2][2] * z;
  }

  // Sun, Moon, planets: apparent topocentric position with refraction.
  for (const body of SOLAR_BODIES) {
    const equ = Astronomy.Equator(body, time, observer, true, true);
    const hor = Astronomy.Horizon(time, observer, equ.ra, equ.dec, "normal");
    const info = { az: hor.azimuth, alt: hor.altitude, dist: equ.dist };
    info.vec = azAltToVec(info.az, info.alt);
    try {
      const illumination = Astronomy.Illumination(body, time);
      info.mag = illumination.mag;
      info.phase = illumination.phase_fraction;
    } catch (error) {
      info.mag = body === "Sun" ? -26.7 : 0;
    }
    sky.bodies[body] = info;
  }
  sky.sunAlt = sky.bodies.Sun.alt;
}

/** J2000 vector -> ENU with the current frame. */
function eqToEnu(v) {
  const m = sky.frame;
  return [
    m[0][0] * v[0] + m[0][1] * v[1] + m[0][2] * v[2],
    m[1][0] * v[0] + m[1][1] * v[1] + m[1][2] * v[2],
    m[2][0] * v[0] + m[2][1] * v[1] + m[2][2] * v[2],
  ];
}

// ---------------------------------------------------------------- stations
const satRecords = {};   // key -> satrec built from the current TLE

/** (Re)build the SGP4 records after loading or downloading TLEs. */
function rebuildSatRecords() {
  for (const key of STATIONS) {
    const tle = getTle(key);
    satRecords[key] = tle ? satellite.twoline2satrec(tle.line1, tle.line2) : null;
  }
  state.passes = { ISS: null, CSS: null };
}

/** Observer in the form satellite.js wants (radians and km). */
function satObserver() {
  return {
    latitude: state.observer.lat * DEG,
    longitude: state.observer.lon * DEG,
    height: state.observer.height / 1000,
  };
}

/**
 * Position of a station at `date`: { vec, az, alt, range, lit } or null.
 * `lit` tells whether sunlight reaches it (otherwise it is invisible).
 */
function stationPosition(key, date) {
  const record = satRecords[key];
  if (!record) return null;
  const pv = satellite.propagate(record, date);
  if (!pv || !pv.position) return null;
  const gmst = satellite.gstime(date);
  const look = satellite.ecfToLookAngles(satObserver(), satellite.eciToEcf(pv.position, gmst));
  const az = ((look.azimuth * RAD) % 360 + 360) % 360;
  const alt = look.elevation * RAD;
  const sun = satellite.sunPos(satellite.jday(date));
  const lit = satellite.shadowFraction(sun.rsun, pv.position) < 0.5;
  return { vec: azAltToVec(az, alt), az, alt, range: look.rangeSat, lit };
}

// Sun altitude is needed many times during the pass search; cache per minute.
const sunAltCache = new Map();
function sunAltitudeAt(date) {
  const minute = Math.floor(date.getTime() / 60000);
  if (sunAltCache.has(minute)) return sunAltCache.get(minute);
  const time = Astronomy.MakeTime(new Date(minute * 60000));
  const observer = astroObserver();
  const equ = Astronomy.Equator("Sun", time, observer, true, true);
  const alt = Astronomy.Horizon(time, observer, equ.ra, equ.dec, "normal").altitude;
  if (sunAltCache.size > 20000) sunAltCache.clear();
  sunAltCache.set(minute, alt);
  return alt;
}

/** Can a station at this position be seen with the naked eye right now? */
function isStationVisible(position, date) {
  return position.alt >= PASS_MIN_VISIBLE_ELEVATION && position.lit &&
    sunAltitudeAt(date) <= SUN_ALT_DARK_ENOUGH;
}

/**
 * Find every pass above the horizon in the next PASS_SEARCH_HOURS.
 * Each pass: { start, end, max, maxAlt, startAz, endAz, maxAz, visible,
 *              visStart, visEnd, visStartAz, visEndAz, visStartAlt, visEndAlt }.
 * The coarse 20 s scan is refined with a bisection on the horizon crossings.
 */
function computePasses(key, fromDate) {
  if (!satRecords[key]) return [];
  sunAltCache.clear();
  const passes = [];
  const startMs = fromDate.getTime() - 10 * 60000; // include a pass in progress
  const endMs = startMs + PASS_SEARCH_HOURS * 3600000;
  const stepMs = PASS_STEP_SECONDS * 1000;

  const altAt = (ms) => { const p = stationPosition(key, new Date(ms)); return p ? p.alt : -90; };
  const refine = (lowMs, highMs, rising) => {
    // Bisection to ~1 s on the time the altitude crosses 0°.
    for (let i = 0; i < 6; i++) {
      const mid = (lowMs + highMs) / 2;
      const above = altAt(mid) > 0;
      if (above === rising) highMs = mid; else lowMs = mid;
    }
    return (lowMs + highMs) / 2;
  };

  let previousAlt = altAt(startMs);
  let current = null;
  for (let ms = startMs + stepMs; ms <= endMs; ms += stepMs) {
    const date = new Date(ms);
    const position = stationPosition(key, date);
    if (!position) break;
    if (previousAlt <= 0 && position.alt > 0) {
      const start = refine(ms - stepMs, ms, true);
      current = { start: new Date(start), maxAlt: -90, visible: false,
        startAz: stationPosition(key, new Date(start)).az };
    }
    if (current && position.alt > 0) {
      if (position.alt > current.maxAlt) {
        current.maxAlt = position.alt; current.max = date; current.maxAz = position.az;
      }
      if (isStationVisible(position, date)) {
        if (!current.visible) {
          current.visible = true; current.visStart = date;
          current.visStartAz = position.az; current.visStartAlt = position.alt;
          current.visMaxAlt = position.alt;
        }
        current.visEnd = date; current.visEndAz = position.az; current.visEndAlt = position.alt;
        current.visMaxAlt = Math.max(current.visMaxAlt, position.alt);
      }
    }
    if (current && previousAlt > 0 && position.alt <= 0) {
      const end = refine(ms - stepMs, ms, false);
      current.end = new Date(end);
      current.endAz = stationPosition(key, new Date(end)).az;
      if (current.end > fromDate) passes.push(current);
      current = null;
    }
    previousAlt = position.alt;
  }
  return passes;
}

/** Passes of a station, computed once and cached until the TLE or place changes. */
function getPasses(key) {
  const cached = state.passes[key];
  const now = nowDate();
  if (cached && Math.abs(now - cached.computedAt) < 30 * 60000) {
    return cached.list.filter((pass) => pass.end > now);
  }
  const list = computePasses(key, now);
  state.passes[key] = { list, computedAt: now };
  return list;
}

/** The station's sky track from `minutesBefore` to `minutesAfter` (for drawing). */
function stationTrack(key, date, minutesBefore, minutesAfter, stepSeconds) {
  const points = [];
  for (let s = -minutesBefore * 60; s <= minutesAfter * 60; s += stepSeconds) {
    const position = stationPosition(key, new Date(date.getTime() + s * 1000));
    if (position) points.push({ vec: position.vec, alt: position.alt, seconds: s, lit: position.lit });
  }
  return points;
}

// ---------------------------------------------------------------- positions
/**
 * Current ENU vector (and extra info) of any catalog object.
 * Returns { vec, az, alt, mag, ... } or null if it cannot be computed.
 */
function objectPosition(object, date) {
  if (!object) return null;
  if (object.kind === "sat") return stationPosition(object.key, date || nowDate());
  if (object.kind === "body") return sky.bodies[object.body] || null;
  const vec = eqToEnu(object.eq);
  const azAlt = vecToAzAlt(vec);
  return { vec, az: azAlt.az, alt: azAlt.alt, mag: object.mag };
}

// ---------------------------------------------------------------- rise and set
/**
 * Rise, set and highest point for non-station objects, looking ahead 24 h.
 * Returns { rise, riseAz, set, setAz, transit, transitAlt, always, never }.
 */
function riseSetInfo(object) {
  const date = nowDate();
  const time = Astronomy.MakeTime(date);
  const observer = astroObserver();
  let body;
  if (object.kind === "body") {
    body = object.body;
  } else {
    // Fixed objects: declare them as a user-defined star (J2000 RA in hours).
    const lat = state.observer.lat;
    if (object.dec > 90 - lat) return { always: true, transit: null };
    if (object.dec < lat - 90) return { never: true };
    Astronomy.DefineStar(Astronomy.Body.Star1, object.ra / 15, object.dec, 1000);
    body = Astronomy.Body.Star1;
  }
  const result = {};
  const horizonAt = (astroTime) => {
    const equ = Astronomy.Equator(body, astroTime, observer, true, true);
    return Astronomy.Horizon(astroTime, observer, equ.ra, equ.dec, "normal");
  };
  const rise = Astronomy.SearchRiseSet(body, observer, +1, time, 1.1);
  const set = Astronomy.SearchRiseSet(body, observer, -1, time, 1.1);
  if (rise) { result.rise = rise.date; result.riseAz = horizonAt(rise).azimuth; }
  if (set) { result.set = set.date; result.setAz = horizonAt(set).azimuth; }
  const transit = Astronomy.SearchHourAngle(body, observer, 0, time);
  if (transit) { result.transit = transit.time.date; result.transitAlt = transit.hor.altitude; }
  if (!rise && !set) {
    const alt = horizonAt(time).altitude;
    if (alt > 0) result.always = true; else result.never = true;
  }
  return result;
}

// ---------------------------------------------------------------- sky state
/** Day / twilight / night label from the Sun's altitude. */
function skyCondition() {
  const alt = sky.sunAlt;
  if (alt > -0.83) return "skyDay";
  if (alt > -6) return "skyCivil";
  if (alt > -12) return "skyNautical";
  if (alt > -18) return "skyAstro";
  return "skyNight";
}

/** How the object can be seen, from its magnitude. */
function visibilityLabel(mag) {
  if (mag === undefined || mag === null) return "";
  if (mag <= 5.5) return t("nakedEye");
  if (mag <= 9) return t("binoculars");
  return t("telescope");
}

// ===== sensors.js
// =============================================================================
// sensors.js - Phone orientation, GPS, camera and screen wake lock.
//
// Orientation: the browser gives three angles (alpha, beta, gamma) that turn
// the phone's own axes into the Earth's axes. From them we compute, in ENU:
//   forward = where the BACK camera points (-z axis of the phone)
//   up      = where the top edge of the SCREEN points
//   right   = where the right edge of the SCREEN points
// The vectors are smoothed so the sky does not shake with the hand.
//
// Android Chrome: "deviceorientationabsolute" (alpha is referenced to North).
// iPhone/iPad Safari: "deviceorientation" + webkitCompassHeading, and the
// permission must be asked from a button tap (DeviceOrientationEvent.requestPermission).
//
// Depends on: core.js (state, settings, vectors). Calls ui.js toast() / refreshStatus().
// =============================================================================

// ---------------------------------------------------------------- configuration
// 0 = frozen, 1 = no smoothing. 0.15 per event (~60 events/s) feels steady
// but still follows the hand without visible lag.
const ORIENTATION_SMOOTHING = 0.15;
const SENSOR_TIMEOUT_MS = 2500;      // no events for this long = sensors lost

// iOS: alpha is relative to where the phone pointed when the page started.
// We learn the difference to the compass heading and keep it smoothed.
let iosAlphaOffset = null;

// ---------------------------------------------------------------- orientation math
/**
 * W3C rotation matrix for alpha, beta, gamma (Z-X'-Y'' intrinsic angles).
 * Columns are the phone's x, y, z axes expressed in ENU (East, North, Up).
 */
function rotationMatrixFromAngles(alphaDeg, betaDeg, gammaDeg) {
  const a = alphaDeg * DEG, b = betaDeg * DEG, g = gammaDeg * DEG;
  const cA = Math.cos(a), sA = Math.sin(a);
  const cB = Math.cos(b), sB = Math.sin(b);
  const cG = Math.cos(g), sG = Math.sin(g);
  return [
    [cA * cG - sA * sB * sG, -cB * sA, cG * sA * sB + cA * sG],
    [cG * sA + cA * sB * sG, cA * cB, sA * sG - cA * cG * sB],
    [-cB * sG, sB, cB * cG],
  ];
}

/** Multiply a 3x3 matrix by a vector. */
function matVec(m, v) {
  return [
    m[0][0] * v[0] + m[0][1] * v[1] + m[0][2] * v[2],
    m[1][0] * v[0] + m[1][1] * v[1] + m[1][2] * v[2],
    m[2][0] * v[0] + m[2][1] * v[1] + m[2][2] * v[2],
  ];
}

/** Rotation of the screen content (0, 90, 180, 270) in degrees. */
function screenAngle() {
  if (screen.orientation && typeof screen.orientation.angle === "number") return screen.orientation.angle;
  return typeof window.orientation === "number" ? window.orientation : 0;
}

/** Smoothly move vector `current` towards `target` and renormalise. */
function blend(current, target, factor) {
  return vecNorm([
    current[0] + (target[0] - current[0]) * factor,
    current[1] + (target[1] - current[1]) * factor,
    current[2] + (target[2] - current[2]) * factor,
  ]);
}

/**
 * Turn one orientation reading into forward/up/right vectors.
 * `alpha` must already be referenced to North (0 = phone top to North,
 * growing counter-clockwise seen from above, as the W3C spec defines).
 */
function applyOrientation(alpha, beta, gamma) {
  // The user can correct a compass that is off by a few degrees.
  const correctedAlpha = alpha - settings.compassOffset;
  const m = rotationMatrixFromAngles(correctedAlpha, beta, gamma);

  // Screen "up" inside the phone frame: rotated by the screen angle so the
  // view stays right when the phone is held in landscape.
  const s = screenAngle() * DEG;
  const screenUp = [Math.sin(s), Math.cos(s), 0];

  const forward = matVec(m, [0, 0, -1]);
  const up = matVec(m, screenUp);
  const sensor = state.sensor;
  const factor = sensor.available ? ORIENTATION_SMOOTHING : 1;
  sensor.forward = blend(sensor.forward, forward, factor);
  // Keep "up" perpendicular to "forward" after smoothing.
  let smoothUp = blend(sensor.up, up, factor);
  smoothUp = vecNorm(vecAdd(smoothUp, vecScale(sensor.forward, -vecDot(smoothUp, sensor.forward))));
  sensor.up = smoothUp;
  // forward x up = right (ENU is right-handed: facing North with up = Up gives East).
  sensor.right = vecCross(sensor.forward, sensor.up);
  sensor.available = true;
  sensor.lastEventMs = performance.now();
}

// ---------------------------------------------------------------- event handlers
/** Android: alpha already measured from North. */
function onAbsoluteOrientation(event) {
  if (event.alpha === null || event.beta === null) return;
  state.sensor.absolute = true;
  applyOrientation(event.alpha, event.beta, event.gamma || 0);
}

/** iOS (and browsers without the absolute event). */
function onRelativeOrientation(event) {
  if (event.alpha === null || event.beta === null) return;
  if (typeof event.webkitCompassHeading === "number" && event.webkitCompassHeading >= 0) {
    // iOS: webkitCompassHeading is clockwise from North; alpha is counter-clockwise.
    const alphaFromCompass = 360 - event.webkitCompassHeading;
    const offset = wrap180(alphaFromCompass - event.alpha);
    // The compass is noisy when the phone is nearly vertical: learn slowly.
    iosAlphaOffset = iosAlphaOffset === null ? offset : iosAlphaOffset + wrap180(offset - iosAlphaOffset) * 0.05;
    state.sensor.absolute = true;
    applyOrientation(event.alpha + iosAlphaOffset, event.beta, event.gamma || 0);
  } else if (event.absolute === true) {
    state.sensor.absolute = true;
    applyOrientation(event.alpha, event.beta, event.gamma || 0);
  }
  // A relative-only reading cannot tell where North is: ignore it.
}

/**
 * Start listening to orientation. Must be called from a tap (iOS asks the
 * user for permission). Resolves to true if events can be expected.
 */
async function startOrientation() {
  if (!window.isSecureContext) {
    toast(t("needsHttps"));
    return false;
  }
  if (typeof DeviceOrientationEvent === "undefined") return false;
  if (typeof DeviceOrientationEvent.requestPermission === "function") {
    try {
      const answer = await DeviceOrientationEvent.requestPermission();
      if (answer !== "granted") return false;
    } catch (error) {
      return false;
    }
  }
  if ("ondeviceorientationabsolute" in window) {
    window.addEventListener("deviceorientationabsolute", onAbsoluteOrientation);
  } else {
    window.addEventListener("deviceorientation", onRelativeOrientation);
  }
  return true;
}

/** True when sensor readings keep arriving. */
function sensorsAlive() {
  return state.sensor.available && performance.now() - state.sensor.lastEventMs < SENSOR_TIMEOUT_MS;
}

// ---------------------------------------------------------------- GPS
let gpsWatchId = null;

/** Follow the GPS position (low power: a few metres do not matter here). */
function startGps() {
  if (!settings.useGps) { state.gpsStatus = "off"; return; }
  if (!("geolocation" in navigator) || !window.isSecureContext) {
    state.gpsStatus = "denied";
    return;
  }
  state.gpsStatus = "waiting";
  gpsWatchId = navigator.geolocation.watchPosition((position) => {
    const moved = Math.abs(position.coords.latitude - state.observer.lat) +
      Math.abs(position.coords.longitude - state.observer.lon) > 0.05;
    state.observer.lat = position.coords.latitude;
    state.observer.lon = position.coords.longitude;
    if (typeof position.coords.altitude === "number") state.observer.height = position.coords.altitude;
    state.gpsStatus = "ok";
    state.gpsAccuracy = position.coords.accuracy;
    // Remember the place for the next start (also used without GPS).
    settings.lat = state.observer.lat;
    settings.lon = state.observer.lon;
    settings.height = state.observer.height;
    saveSettings();
    if (moved) onObserverChanged();
  }, () => {
    state.gpsStatus = "denied";
    refreshStatus();
  }, { enableHighAccuracy: false, maximumAge: 300000, timeout: 30000 });
}

function stopGps() {
  if (gpsWatchId !== null) navigator.geolocation.clearWatch(gpsWatchId);
  gpsWatchId = null;
}

// ---------------------------------------------------------------- camera
let cameraStream = null;

/** Show the back camera behind the drawn sky. */
async function startCamera() {
  const video = document.getElementById("camera");
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }, audio: false,
    });
    video.srcObject = cameraStream;
    await video.play();
    state.cameraOn = true;
    document.body.classList.add("camera-on");
  } catch (error) {
    toast(t("cameraFailed"));
    stopCamera();
  }
}

function stopCamera() {
  if (cameraStream) cameraStream.getTracks().forEach((track) => track.stop());
  cameraStream = null;
  state.cameraOn = false;
  document.body.classList.remove("camera-on");
  document.getElementById("camera").srcObject = null;
}

// ---------------------------------------------------------------- wake lock
let wakeLock = null;

/** Keep the screen on while the app is open (where the browser allows it). */
async function keepScreenOn() {
  try {
    if ("wakeLock" in navigator && document.visibilityState === "visible") {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (error) {
    wakeLock = null; // not allowed (battery saver, old browser...)
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.started) keepScreenOn();
});

/** Short vibration when the target reaches the centre (Android only). */
function buzz() {
  try { if (navigator.vibrate) navigator.vibrate([60, 40, 60]); } catch (error) { /* ignore */ }
}

// ===== render.js
// =============================================================================
// render.js - Draws the sky on the full-screen canvas.
//
// Projection: gnomonic ("pin-hole camera"), the same a phone camera uses, so
// the drawn sky can sit on top of the camera picture. Great circles (the
// horizon, constellation lines, azimuth lines) come out as straight lines.
//
// Drawing order: background -> grid -> constellation lines -> stars ->
// ground (semi-transparent, dims what is below the horizon) -> horizon ->
// planets/Moon/Sun -> stations -> deep sky -> labels -> target marker ->
// centre cross -> guide arrow.
//
// Depends on: core.js, astro.js (sky, catalog, positions), sensors.js
// (sensorsAlive), ui.js (guidance values in `guide`).
// =============================================================================

// ---------------------------------------------------------------- configuration
const COLORS = {
  nightSky: "#04060d",
  ground: "rgba(28, 22, 14, 0.82)",
  groundCamera: "rgba(28, 22, 14, 0.35)",
  horizon: "rgba(140, 200, 140, 0.8)",
  grid: "rgba(120, 150, 200, 0.18)",
  lines: "rgba(110, 150, 220, 0.45)",
  linesTarget: "rgba(255, 210, 120, 0.95)",
  constName: "rgba(140, 170, 230, 0.75)",
  starName: "rgba(230, 230, 210, 0.85)",
  planetName: "#ffd98a",
  station: "#ffffff",
  stationDim: "rgba(160, 170, 190, 0.8)",
  track: "rgba(255, 240, 160, 0.75)",
  target: "#ffb84d",
  cross: "rgba(255, 255, 255, 0.55)",
  arrow: "#ffb84d",
};
const PLANET_COLORS = {
  Mercury: "#c9b8a6", Venus: "#fff3c4", Mars: "#ff8a5c", Jupiter: "#f2d9b0",
  Saturn: "#f0dc9a", Uranus: "#a8e6f0", Neptune: "#8fb0ff",
};
const LABEL_FONT = "13px system-ui, -apple-system, Segoe UI, Roboto, sans-serif";
const SMALL_FONT = "11px system-ui, -apple-system, Segoe UI, Roboto, sans-serif";
const TAP_RADIUS_PX = 28;            // how close a tap must be to pick an object

// ---------------------------------------------------------------- canvas setup
const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");
const view = { width: 0, height: 0, focal: 1, forward: [0, 1, 0], up: [0, 0, 1], right: [1, 0, 0] };
let hitPoints = [];                  // [{x, y, id}] filled while drawing, used by taps
let labelBoxes = [];                 // rectangles already used by labels

/** Match the canvas to the screen size (sharp on high-density screens). */
function resizeCanvas() {
  const ratio = Math.min(window.devicePixelRatio || 1, 2.5);
  view.width = window.innerWidth;
  view.height = window.innerHeight;
  canvas.width = Math.round(view.width * ratio);
  canvas.height = Math.round(view.height * ratio);
  canvas.style.width = view.width + "px";
  canvas.style.height = view.height + "px";
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
}
window.addEventListener("resize", resizeCanvas);

/** Vertical field of view in use (the camera's when the camera is on). */
function currentFov() {
  return state.cameraOn ? settings.cameraFov : settings.fov;
}

/** Fill `view` with the direction the screen looks at, for this frame. */
function updateViewBasis() {
  if (state.mode === "sensors" && sensorsAlive()) {
    view.forward = state.sensor.forward;
    view.up = state.sensor.up;
    view.right = state.sensor.right;
  } else {
    // Manual view: looking at manualAz/manualAlt, screen top towards the zenith.
    const forward = azAltToVec(state.manualAz, state.manualAlt);
    let up = vecAdd([0, 0, 1], vecScale(forward, -forward[2]));
    if (vecLength(up) < 1e-6) up = azAltToVec(state.manualAz + 180, 0);
    view.forward = forward;
    view.up = vecNorm(up);
    view.right = vecCross(view.forward, view.up);
  }
  view.focal = (view.height / 2) / Math.tan(currentFov() * DEG / 2);
}

/** Project an ENU unit vector to screen pixels, or null if behind the viewer. */
function project(v) {
  const z = v[0] * view.forward[0] + v[1] * view.forward[1] + v[2] * view.forward[2];
  if (z <= 0.01) return null;
  const x = v[0] * view.right[0] + v[1] * view.right[1] + v[2] * view.right[2];
  const y = v[0] * view.up[0] + v[1] * view.up[1] + v[2] * view.up[2];
  return { x: view.width / 2 + view.focal * x / z, y: view.height / 2 - view.focal * y / z, z };
}

/** True if a projected point is on (or near) the screen. */
function onScreen(p, margin) {
  const m = margin || 0;
  return p && p.x >= -m && p.y >= -m && p.x <= view.width + m && p.y <= view.height + m;
}

/** Project a segment, clipping it at the plane just in front of the viewer. */
function projectSegment(a, b) {
  const za = vecDot(a, view.forward), zb = vecDot(b, view.forward);
  if (za <= 0.02 && zb <= 0.02) return null;
  let p = a, q = b;
  if (za <= 0.02) p = vecAdd(a, vecScale(vecAdd(b, vecScale(a, -1)), (0.02 - za) / (zb - za)));
  if (zb <= 0.02) q = vecAdd(a, vecScale(vecAdd(b, vecScale(a, -1)), (0.02 - za) / (zb - za)));
  const pa = project(p), pb = project(q);
  return pa && pb ? [pa, pb] : null;
}

// ---------------------------------------------------------------- labels
/** Draw a label unless it would cover another one. */
function drawLabel(text, x, y, color, font, force) {
  ctx.font = font || LABEL_FONT;
  const width = ctx.measureText(text).width;
  const box = { x: x - 2, y: y - 12, w: width + 4, h: 15 };
  if (!force) {
    for (const other of labelBoxes) {
      if (box.x < other.x + other.w && box.x + box.w > other.x &&
          box.y < other.y + other.h && box.y + box.h > other.y) return false;
    }
  }
  labelBoxes.push(box);
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillText(text, x + 1, y + 1);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  return true;
}

// ---------------------------------------------------------------- background
/** Sky colour from the Sun's altitude (day blue -> twilight -> night). */
function skyColor() {
  const alt = sky.sunAlt;
  if (alt > 5) return "#2d5f93";
  if (alt > -2) return "#284f7d";
  if (alt > -6) return "#1a2e52";
  if (alt > -12) return "#0d1630";
  if (alt > -18) return "#070c1c";
  return COLORS.nightSky;
}

function drawBackground() {
  if (state.cameraOn) {
    ctx.clearRect(0, 0, view.width, view.height);
    ctx.fillStyle = "rgba(0, 0, 10, 0.25)";
    ctx.fillRect(0, 0, view.width, view.height);
  } else {
    ctx.fillStyle = skyColor();
    ctx.fillRect(0, 0, view.width, view.height);
  }
}

/**
 * Ground: everything below the horizon. In this projection the horizon is a
 * straight line, so the ground is the part of the screen rectangle on one
 * side of it (clip the rectangle with that half-plane).
 */
function drawGround() {
  const ux = vecDot([0, 0, 1], view.right);
  const uy = vecDot([0, 0, 1], view.up);
  const uz = vecDot([0, 0, 1], view.forward);
  // A pixel (px, py) looks below the horizon when this value is negative.
  const side = (px, py) => (px - view.width / 2) * ux + (view.height / 2 - py) * uy + view.focal * uz;
  const corners = [[0, 0], [view.width, 0], [view.width, view.height], [0, view.height]];
  const polygon = [];
  for (let i = 0; i < 4; i++) {
    const a = corners[i], b = corners[(i + 1) % 4];
    const sa = side(a[0], a[1]), sb = side(b[0], b[1]);
    if (sa < 0) polygon.push(a);
    if ((sa < 0) !== (sb < 0)) {
      const k = sa / (sa - sb);
      polygon.push([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]);
    }
  }
  if (polygon.length < 3) return;
  ctx.beginPath();
  polygon.forEach((point, i) => (i ? ctx.lineTo(point[0], point[1]) : ctx.moveTo(point[0], point[1])));
  ctx.closePath();
  ctx.fillStyle = state.cameraOn ? COLORS.groundCamera : COLORS.ground;
  ctx.fill();
}

// ---------------------------------------------------------------- grid and horizon
/** Draw a line through a list of ENU vectors (skips parts behind the viewer). */
function strokeVectorPath(vectors, closed) {
  ctx.beginPath();
  let penDown = false;
  const count = closed ? vectors.length + 1 : vectors.length;
  for (let i = 0; i < count; i++) {
    const p = project(vectors[i % vectors.length]);
    if (!p || Math.abs(p.x) > 1e5 || Math.abs(p.y) > 1e5) { penDown = false; continue; }
    if (penDown) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y);
    penDown = true;
  }
  ctx.stroke();
}

function drawGrid() {
  if (!settings.showGrid) return;
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 1;
  for (let alt = 15; alt < 90; alt += 15) {
    const ring = [];
    for (let az = 0; az < 360; az += 3) ring.push(azAltToVec(az, alt));
    strokeVectorPath(ring, true);
    const p = project(azAltToVec(vecToAzAlt(view.forward).az, alt));
    if (onScreen(p)) drawLabel(alt + "°", p.x + 4, p.y - 2, COLORS.grid.replace("0.18", "0.7"), SMALL_FONT);
  }
  for (let az = 0; az < 360; az += 30) {
    const line = [];
    for (let alt = 0; alt <= 90; alt += 3) line.push(azAltToVec(az, alt));
    strokeVectorPath(line, false);
  }
}

function drawHorizon() {
  const ring = [];
  for (let az = 0; az < 360; az += 2) ring.push(azAltToVec(az, 0));
  ctx.strokeStyle = COLORS.horizon;
  ctx.lineWidth = 1.5;
  strokeVectorPath(ring, true);
  // Compass points on the horizon (big letters for N, E, S, W).
  for (let i = 0; i < 16; i++) {
    const az = i * 22.5;
    const p = project(azAltToVec(az, 1.2));
    if (!onScreen(p, 20)) continue;
    const name = directionName(az);
    const main = i % 4 === 0;
    ctx.font = main ? "bold 18px system-ui, sans-serif" : SMALL_FONT;
    const width = ctx.measureText(name).width;
    drawLabel(name, p.x - width / 2, p.y, main ? "#ff9e7a" : COLORS.horizon, ctx.font, main);
  }
}

// ---------------------------------------------------------------- constellations
function drawConstellationLines(target) {
  const highlighted = target && target.kind === "const" ? target.abbr : null;
  if (!settings.showLines && !highlighted) return;
  ctx.lineWidth = 1;
  for (const abbr of Object.keys(sky.lineEq)) {
    const isTarget = abbr === highlighted;
    if (!settings.showLines && !isTarget) continue;
    ctx.strokeStyle = isTarget ? COLORS.linesTarget : COLORS.lines;
    ctx.lineWidth = isTarget ? 2 : 1;
    ctx.beginPath();
    for (const polyline of sky.lineEq[abbr]) {
      let previous = eqToEnu([polyline[0], polyline[1], polyline[2]]);
      for (let i = 3; i < polyline.length; i += 3) {
        const next = eqToEnu([polyline[i], polyline[i + 1], polyline[i + 2]]);
        const segment = projectSegment(previous, next);
        if (segment) { ctx.moveTo(segment[0].x, segment[0].y); ctx.lineTo(segment[1].x, segment[1].y); }
        previous = next;
      }
    }
    ctx.stroke();
  }
}

function drawConstellationNames(target) {
  if (!settings.showConstNames) return;
  for (const object of catalog) {
    if (object.kind !== "const") continue;
    const isTarget = target === object;
    if (!isTarget && object.rank > 2 && currentFov() > 60) continue;
    const p = project(objectPosition(object).vec);
    if (!onScreen(p)) continue;
    const name = objectName(object).toUpperCase();
    ctx.font = SMALL_FONT;
    const width = ctx.measureText(name).width;
    if (drawLabel(name, p.x - width / 2, p.y, isTarget ? COLORS.linesTarget : COLORS.constName, SMALL_FONT, isTarget)) {
      hitPoints.push({ x: p.x, y: p.y, id: object.id });
    }
  }
}

// ---------------------------------------------------------------- stars
/** Approximate star colour from its B-V colour index. */
function starColor(bv) {
  if (bv < 0) return "#aac4ff";
  if (bv < 0.3) return "#d8e4ff";
  if (bv < 0.6) return "#fbf8ff";
  if (bv < 0.9) return "#fff1d8";
  if (bv < 1.3) return "#ffd9a8";
  return "#ffbe86";
}

/** Faintest magnitude worth drawing: depends on zoom and on daylight. */
function magnitudeLimit() {
  const zoomGain = 2.5 * Math.log10(70 / currentFov());   // zooming in shows fainter stars
  let limit = 5.6 + Math.max(0, zoomGain);
  if (sky.sunAlt > -6) limit = Math.min(limit, 3.5);
  if (sky.sunAlt > 0) limit = Math.min(limit, 1.5);
  return Math.min(limit, 6.5);
}

function drawStars() {
  const limit = magnitudeLimit();
  const sizeGain = Math.sqrt(70 / currentFov());
  const enu = sky.starEnu;
  const count = SKY_STARS.length / 4;
  const v = [0, 0, 0];
  for (let i = 0; i < count; i++) {
    const mag = SKY_STARS[i * 4 + 2];
    if (mag > limit) continue;
    v[0] = enu[i * 3]; v[1] = enu[i * 3 + 1]; v[2] = enu[i * 3 + 2];
    const p = project(v);
    if (!onScreen(p, 4)) continue;
    const radius = Math.max(0.7, Math.min(6, (6.4 - mag) * 0.5 * sizeGain));
    ctx.globalAlpha = Math.min(1, 0.45 + (limit - mag) * 0.25);
    ctx.fillStyle = starColor(SKY_STARS[i * 4 + 3]);
    ctx.beginPath();
    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawStarNames(target) {
  const fov = currentFov();
  const nameLimit = fov < 35 ? 4.5 : fov < 60 ? 2.6 : 1.7;
  for (const row of SKY_NAMED_STARS) {
    const starIndex = row[0];
    const mag = SKY_STARS[starIndex * 4 + 2];
    const object = catalogById["star:" + starIndex];
    const isTarget = object && object === target;
    if (!isTarget && (!settings.showStarNames || mag > nameLimit)) continue;
    const v = [sky.starEnu[starIndex * 3], sky.starEnu[starIndex * 3 + 1], sky.starEnu[starIndex * 3 + 2]];
    const p = project(v);
    if (!onScreen(p)) continue;
    const name = state.lang === "es" ? row[1] : row[2];
    if (drawLabel(name, p.x + 6, p.y - 4, COLORS.starName, SMALL_FONT, isTarget) && object) {
      hitPoints.push({ x: p.x, y: p.y, id: object.id });
    }
  }
}

// ---------------------------------------------------------------- deep sky
function drawDeepSky(target) {
  for (const object of catalog) {
    if (object.kind !== "deep") continue;
    const isTarget = object === target;
    if (!isTarget && currentFov() > 75 && object.mag > 3.5) continue;
    const p = project(objectPosition(object).vec);
    if (!onScreen(p, 10)) continue;
    ctx.strokeStyle = isTarget ? COLORS.target : "rgba(180, 220, 200, 0.7)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (object.type === "s") ctx.ellipse(p.x, p.y, 9, 4, -0.6, 0, Math.PI * 2);
    else ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.stroke();
    if (drawLabel(objectName(object), p.x + 9, p.y + 4, "rgba(180, 220, 200, 0.9)", SMALL_FONT, isTarget)) {
      hitPoints.push({ x: p.x, y: p.y, id: object.id });
    }
  }
}

// ---------------------------------------------------------------- solar system
/** Draw the Moon with its phase, lit side turned towards the Sun. */
function drawMoon(p, radius) {
  const moon = sky.bodies.Moon;
  const sunP = project(sky.bodies.Sun.vec);
  // Direction of the Sun on the screen; if it is behind us use its tangent direction.
  let angle;
  if (sunP) {
    angle = Math.atan2(sunP.y - p.y, sunP.x - p.x);
  } else {
    const s = sky.bodies.Sun.vec;
    angle = Math.atan2(-vecDot(s, view.up), vecDot(s, view.right));
  }
  const phase = moon.phase === undefined ? 1 : moon.phase;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(angle);
  ctx.fillStyle = "#2b2b30";
  ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();
  // Lit half towards +x (the Sun), plus an ellipse that adds or removes light.
  ctx.fillStyle = "#f4f1e4";
  ctx.beginPath();
  ctx.arc(0, 0, radius, -Math.PI / 2, Math.PI / 2, false);
  const k = (2 * phase - 1) * radius;              // >0 gibbous, <0 crescent
  ctx.ellipse(0, 0, Math.abs(k), radius, 0, Math.PI / 2, -Math.PI / 2, k < 0);
  ctx.fill();
  ctx.restore();
}

function drawSolarSystem(target) {
  for (const body of SOLAR_BODIES) {
    const info = sky.bodies[body];
    if (!info) continue;
    const p = project(info.vec);
    if (!onScreen(p, 30)) continue;
    const object = catalogById["body:" + body];
    const below = info.alt < 0;
    ctx.globalAlpha = below ? 0.45 : 1;
    if (body === "Sun") {
      const glow = ctx.createRadialGradient(p.x, p.y, 4, p.x, p.y, 40);
      glow.addColorStop(0, "rgba(255, 240, 180, 0.9)");
      glow.addColorStop(1, "rgba(255, 200, 80, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(p.x, p.y, 40, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff6c8";
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(8, view.focal * 0.0047), 0, Math.PI * 2); ctx.fill();
    } else if (body === "Moon") {
      drawMoon(p, Math.max(9, view.focal * 0.0045));
    } else {
      const radius = Math.max(2.5, Math.min(7, (3 - info.mag) * 1.1));
      ctx.fillStyle = PLANET_COLORS[body];
      ctx.beginPath(); ctx.arc(p.x, p.y, radius, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Move the label out of the pulsing target ring when this is the target.
    drawLabel(t(body), p.x + (object === target ? 24 : 11), p.y - 6, COLORS.planetName, LABEL_FONT, object === target);
    hitPoints.push({ x: p.x, y: p.y, id: object.id });
  }
}

// ---------------------------------------------------------------- stations
function drawStations(target, date) {
  for (const key of STATIONS) {
    const object = catalogById["sat:" + key];
    const position = stationPosition(key, date);
    if (!position) continue;
    // Track: 2 minutes behind, 10 minutes ahead, only while above the horizon.
    if (settings.showTrack && (position.alt > -10 || object === target)) {
      const track = stationTrack(key, date, 2, 10, 15);
      ctx.strokeStyle = COLORS.track;
      ctx.setLineDash([4, 5]);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      let penDown = false;
      for (let i = 1; i < track.length; i++) {
        if (track[i].alt < -5 && track[i - 1].alt < -5) { penDown = false; continue; }
        const segment = projectSegment(track[i - 1].vec, track[i].vec);
        if (!segment) { penDown = false; continue; }
        if (!penDown) ctx.moveTo(segment[0].x, segment[0].y);
        ctx.lineTo(segment[1].x, segment[1].y);
        penDown = true;
      }
      ctx.stroke();
      ctx.setLineDash([]);
      // Small ticks every minute ahead, so you can tell how fast it comes.
      for (const point of track) {
        if (point.seconds <= 0 || point.seconds % 60 !== 0) continue;
        const p = project(point.vec);
        if (!onScreen(p)) continue;
        ctx.fillStyle = COLORS.track;
        ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
        if (point.seconds % 120 === 0 && object === target) {
          drawLabel("+" + point.seconds / 60 + " min", p.x + 5, p.y + 12, COLORS.track, SMALL_FONT);
        }
      }
    }
    const p = project(position.vec);
    if (!onScreen(p, 10)) continue;
    const visible = isStationVisible(position, date);
    ctx.fillStyle = visible ? COLORS.station : COLORS.stationDim;
    ctx.globalAlpha = position.alt < 0 ? 0.5 : 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, visible ? 5 : 4, 0, Math.PI * 2); ctx.fill();
    // Little solar-panel bars make the stations easy to tell from stars.
    ctx.fillRect(p.x - 11, p.y - 1.5, 6, 3);
    ctx.fillRect(p.x + 5, p.y - 1.5, 6, 3);
    ctx.globalAlpha = 1;
    drawLabel(t(key + "short"), p.x + (object === target ? 24 : 12), p.y - 7, visible ? "#ffffff" : COLORS.stationDim, LABEL_FONT, true);
    hitPoints.push({ x: p.x, y: p.y, id: object.id });
  }
}

// ---------------------------------------------------------------- target and guide
function drawTargetMarker(targetPosition) {
  if (!targetPosition) return;
  const p = project(targetPosition.vec);
  if (!onScreen(p, 30)) return;
  const pulse = 18 + 3 * Math.sin(performance.now() / 250);
  ctx.strokeStyle = COLORS.target;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(p.x, p.y, pulse, 0, Math.PI * 2); ctx.stroke();
}

function drawCentreCross() {
  const cx = view.width / 2, cy = view.height / 2;
  ctx.strokeStyle = state.calibrating ? COLORS.target : COLORS.cross;
  ctx.lineWidth = state.calibrating ? 2 : 1.2;
  ctx.beginPath();
  ctx.moveTo(cx - 22, cy); ctx.lineTo(cx - 7, cy);
  ctx.moveTo(cx + 7, cy); ctx.lineTo(cx + 22, cy);
  ctx.moveTo(cx, cy - 22); ctx.lineTo(cx, cy - 7);
  ctx.moveTo(cx, cy + 7); ctx.lineTo(cx, cy + 22);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 30, 0, Math.PI * 2); ctx.stroke();
}

/**
 * Big arrow from the centre towards the target. Its screen direction comes
 * from the target's position in camera coordinates, which also works when
 * the target is behind the viewer (then the arrow says "turn around").
 */
function drawGuideArrow(targetPosition) {
  if (!targetPosition) return;
  const v = targetPosition.vec;
  const x = vecDot(v, view.right), y = vecDot(v, view.up);
  const separation = angleBetween(v, view.forward);
  const p = project(v);
  // Hide the arrow when the target is comfortably on screen near the centre.
  if (separation < 4 || (onScreen(p, -40) && separation < currentFov() * 0.3)) return;
  let dx = x, dy = -y;
  if (Math.hypot(dx, dy) < 1e-3) { dx = 0; dy = 1; }     // exactly behind: point down
  const angle = Math.atan2(dy, dx);
  const radius = Math.min(view.width, view.height) * 0.28;
  const cx = view.width / 2 + Math.cos(angle) * radius;
  const cy = view.height / 2 + Math.sin(angle) * radius;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.fillStyle = COLORS.arrow;
  ctx.globalAlpha = 0.92;
  ctx.beginPath();
  ctx.moveTo(34, 0); ctx.lineTo(-6, -24); ctx.lineTo(2, -9); ctx.lineTo(-30, -9);
  ctx.lineTo(-30, 9); ctx.lineTo(2, 9); ctx.lineTo(-6, 24);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------- main draw
/** Draw one full frame. Returns the target's position for the guidance text. */
function drawFrame() {
  const date = nowDate();
  updateSkyFrame(false);
  updateViewBasis();
